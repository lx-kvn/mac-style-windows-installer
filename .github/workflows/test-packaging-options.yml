name: Test Packaging Options

# 這個 workflow 只做一件事：實際打包一顆涵蓋大部分打包欄位的 Setup.exe、
# 靜默安裝到這台用完即丟的 runner 上、用 PowerShell 檢查登錄表/服務/
# 排程工作/PATH/檔案關聯等系統層級效果真的發生，再靜默解除安裝、確認
# 清乾淨。跟 build.yml 完全獨立、只用 workflow_dispatch 手動觸發——不會
# 因為平常 push/打 v* tag 就自動跑，不會拖慢或干擾 /released 的正式發布
# 流程，也不會被那個流程間接觸發。
#
# 現有的 tests/test_builder.py / tests/test_installer_core_misc.py 全部
# mock 掉 subprocess/winreg/pyinstaller，只驗證欄位有沒有正確串接、邏輯
# 分支對不對，沒辦法驗證「裝到真實系統上，服務/排程工作/PATH/檔案關聯
# 真的被建立」這件事——這個 workflow 補的就是這一塊。
on:
  workflow_dispatch:

jobs:
  test-packaging-options:
    runs-on: windows-latest

    # 理由同 build.yml：這台 runner 預設主控台/檔案編碼是英文語系
    # （cp1252），這個專案到處是中文訊息，不強制 UTF-8 會整批
    # UnicodeEncodeError。
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 準備測試用的 app_dir 與前置/後置腳本
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test_app | Out-Null
          # 借用系統內建的 notepad.exe 當替身，不需要自己生一支真的可執行
          # 的測試程式——這個 workflow 只驗證「打包/安裝/解除安裝這幾個
          # 系統層級動作有沒有發生」，不需要這個 exe 本身真的能正常運作。
          Copy-Item "$env:WINDIR\System32\notepad.exe" test_app\app.exe

          # 真實抓到的坑：installer_core._run_install_script() 用
          # get_resource_path() 解析腳本路徑，指向 PyInstaller 解壓出來的
          # 暫存資源目錄，不是安裝目錄——腳本裡如果用 %~dp0（自己所在的
          # 目錄）當標記檔案的落地位置，寫的其實是那個隨行程結束就被
          # PyInstaller 清掉的暫存目錄，事後根本查不到。改寫到 %TEMP%
          # 這種不受腳本實際執行位置影響的穩定路徑。
          Set-Content -Path test_app\pre_install.bat -Encoding ASCII -Value @(
            "@echo off",
            'echo done > "%TEMP%\mswi_ci_pre_marker.txt"'
          )
          Set-Content -Path test_app\post_install.bat -Encoding ASCII -Value @(
            "@echo off",
            'echo done > "%TEMP%\mswi_ci_post_marker.txt"'
          )

      - name: 產生涵蓋主要打包欄位的設定檔
        shell: pwsh
        run: |
          $config = @{
            app_dir              = "test_app"
            png_icon             = "branding/icon.png"
            ico_icon             = "branding/icon.ico"
            app_name             = "MswiCiTest"
            version              = "1.0.0"
            publisher            = "mswi-ci"
            exe_name             = "Setup_MswiCiTest"
            main_exe             = "app.exe"
            # 必要：CI runner 是無人值守環境，沒有人可以回應提權要求。
            # 實測（2026-09-03，Windows 11 虛擬機的使用者桌面，權杖未提升、
            # UAC 全開）：啟動要求提權的安裝檔會立刻以「操作被使用者取消」
            # （ERROR_CANCELLED）失敗，不會出現提示，也不會卡住——沒有可以
            # 顯示同意提示的輸入桌面時，Windows 直接回絕。因此風險是「必定
            # 失敗」而不是原本這裡所寫的「卡死整個 job」。
            #
            # 這個值連帶決定了這個 job 能涵蓋哪些欄位：windows_service 與
            # create_restore_point_before_install 都需要系統管理員權限，
            # 與它是打包階段就會被擋下的矛盾組合（見 packaging_core 的
            # admin.service_conflict／admin.restore_point_conflict）。那
            # 兩個欄位由下面的 test-admin-only-options job 承接。
            no_admin_install     = $true
            add_to_path          = $true
            file_associations    = ".mswitest"
            pre_install_script   = "pre_install.bat"
            post_install_script  = "post_install.bat"
            scheduled_task       = @{
              task_name         = "MswiCiTestTask"
              exe_relative_path = "app.exe"
              trigger           = "onlogon"
            }
          }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Path test_config.json -Encoding UTF8
          Get-Content test_config.json

      - name: 打包 Setup.exe
        run: python builder_cli.py pack --config test_config.json

      - name: 靜默安裝
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\Setup_MswiCiTest.exe" -ArgumentList "/S" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "靜默安裝回報失敗，exit code = $($proc.ExitCode)"
          }

      - name: 驗證安裝後的系統狀態
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\MswiCiTest"
          $failures = @()

          function Check($name, $condition) {
            if ($condition) {
              Write-Host "PASS: $name"
            } else {
              Write-Host "FAIL: $name"
              $script:failures += $name
            }
          }

          Check "app.exe 存在於安裝目錄" (Test-Path (Join-Path $installDir "app.exe"))
          Check "解除安裝登錄表項目存在（HKCU，no_admin_install=true）" `
            (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MswiCiTest")
          Check "排程工作已註冊" ([bool](Get-ScheduledTask -TaskName "MswiCiTestTask" -ErrorAction SilentlyContinue))
          Check "PATH（HKCU\Environment）包含安裝目錄" `
            ((Get-ItemProperty "HKCU:\Environment" -Name Path -ErrorAction SilentlyContinue).Path -like "*$installDir*")
          Check "安裝前置腳本有執行" (Test-Path (Join-Path $env:TEMP "mswi_ci_pre_marker.txt"))
          Check "安裝後置腳本有執行" (Test-Path (Join-Path $env:TEMP "mswi_ci_post_marker.txt"))

          # 檔案關聯。這一段原本寫在 HKLM 底下找，而且找不到時只警告不失敗，
          # 註解把原因歸給「runner 的 UAC/權杖狀態」——**那個診斷是錯的**。
          # file_assoc.py 早就接上了 InstallScope：no_admin_install=true 時
          # 寫的是 HKCU\Software\Classes（見該模組 register() 的 hive 那一行）。
          # 也就是說這個檢查一直在錯的地方找，於是永遠 WARN、永遠不會失敗
          # ——一條從來沒有驗到東西的檢查（2026-09-09 修正）。
          #
          # 驗的是真正讓「雙擊那個副檔名會開啟這支程式」成立的那幾個機碼，
          # 不只是「副檔名機碼在不在」：副檔名要指向 ProgID、ProgID 底下的
          # open 命令要指向裝好的那支 exe。少了後者，關聯存在但點了沒反應。
          $classes = "HKCU:\Software\Classes"
          $progId = "AppFilemswitest"   # file_extension.prog_id() 的對外契約
          Check "副檔名機碼存在（HKCU，no_admin_install=true）" (Test-Path "$classes\.mswitest")
          if (Test-Path "$classes\.mswitest") {
            $pointsAt = (Get-ItemProperty "$classes\.mswitest" -ErrorAction SilentlyContinue).'(default)'
            Check "副檔名指向 ProgID $progId" ($pointsAt -eq $progId)
          } else {
            $failures += "副檔名指向 ProgID $progId"
          }
          $cmdKey = "$classes\$progId\shell\open\command"
          Check "ProgID 的開啟命令存在" (Test-Path $cmdKey)
          if (Test-Path $cmdKey) {
            $cmd = (Get-ItemProperty $cmdKey -ErrorAction SilentlyContinue).'(default)'
            Check "開啟命令指向裝好的 app.exe" ($cmd -like "*$installDir*app.exe*")
          } else {
            $failures += "開啟命令指向裝好的 app.exe"
          }

          if ($failures.Count -gt 0) {
            Write-Host "共 $($failures.Count) 項驗證失敗：$($failures -join '、')"
            exit 1
          }

      - name: 靜默解除安裝
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\MswiCiTest"
          $proc = Start-Process -FilePath (Join-Path $installDir "uninstall.exe") -ArgumentList "--silent" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "靜默解除安裝回報失敗，exit code = $($proc.ExitCode)"
          }
          # 解除安裝會排程一個背景 .bat 刪除 uninstall.exe 自己（見
          # self_delete.py），給它幾秒鐘完成，下面的驗證才會準確。
          Start-Sleep -Seconds 5

      - name: 驗證解除安裝後已清乾淨
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\MswiCiTest"
          $failures = @()

          function Check($name, $condition) {
            if ($condition) {
              Write-Host "PASS: $name"
            } else {
              Write-Host "FAIL: $name"
              $script:failures += $name
            }
          }

          Check "安裝目錄已移除" (-not (Test-Path $installDir))
          Check "解除安裝登錄表項目已移除" `
            (-not (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MswiCiTest"))
          Check "排程工作已移除" (-not [bool](Get-ScheduledTask -TaskName "MswiCiTestTask" -ErrorAction SilentlyContinue))
          Check "檔案關聯的副檔名機碼已移除" (-not (Test-Path "HKCU:\Software\Classes\.mswitest"))
          Check "檔案關聯的 ProgID 已移除" (-not (Test-Path "HKCU:\Software\Classes\AppFilemswitest"))
          Check "PATH（HKCU\Environment）已移除安裝目錄" `
            ((Get-ItemProperty "HKCU:\Environment" -Name Path -ErrorAction SilentlyContinue).Path -notlike "*$installDir*")

          if ($failures.Count -gt 0) {
            Write-Host "共 $($failures.Count) 項驗證失敗：$($failures -join '、')"
            exit 1
          }

      - name: 收集安裝/解除安裝紀錄到工作目錄
        # 不管前面的驗證步驟成功或失敗都要收集，才能事後排查失敗原因；
        # 這裡先用真正的 $env:TEMP（PowerShell 執行當下的 runner 環境變數）
        # 把 log 複製進 repo 工作目錄，下一步 upload-artifact 的 path 才能
        # 用固定的相對路徑，不用依賴 GitHub Actions 的 env context（那個
        # 只認得明確用 env: 宣告過的變數，不會自動繼承 runner 的 OS 環境
        # 變數，直接寫 ${{ env.TEMP }} 解析不出來）。
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          Copy-Item (Join-Path $env:TEMP "MswiCiTest_silent_install_log.txt") logs\ -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $env:TEMP "MswiCiTest_uninstall_log.txt") logs\ -ErrorAction SilentlyContinue

      - name: 上傳安裝/解除安裝紀錄（不管成功失敗都上傳，方便事後排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-packaging-options-logs
          path: logs\
          if-no-files-found: warn

  # 需要系統管理員權限的兩個欄位（windows_service、
  # create_restore_point_before_install）。它們與 no_admin_install 互斥，
  # 因此不能併進上面那個 job 的設定裡——那個 job 必須維持
  # no_admin_install=true（見該處說明）。分成兩個 job 而不是在同一個 job
  # 裡裝兩次：runner 用完即丟，兩次安裝共用同一台機器時，第一次留下的
  # 狀態會讓第二次的「已清乾淨」驗證失去意義。
  #
  # GitHub 的 Windows runner 以系統管理員身分執行，--uac-admin 編譯出來的
  # 安裝檔在這裡不需要人在旁邊按確認。這個前提已在等價的權杖狀態下實測過
  # （2026-09-03，Windows 11 虛擬機的工作階段 0，IsInRole(Administrator)
  # 為 True）：靜默安裝以結束碼 0 於七秒內完成，Program Files 的安裝目錄、
  # HKLM 的解除安裝登錄、sc.exe 建立的服務三者皆成立，靜默解除安裝亦清乾淨。
  #
  # timeout-minutes 保留作為保險。同一次實測顯示前提不成立時的症狀是立刻
  # 失敗（ERROR_CANCELLED）而非無限等待，因此這個上限預期不會被用到；留著
  # 是因為「不會被用到」與「不需要」是兩回事，而佔住 runner 的代價很高。
  test-admin-only-options:
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 準備測試用的 app_dir
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path admin_app | Out-Null
          Copy-Item "$env:WINDIR\System32\notepad.exe" admin_app\app.exe
          Set-Content -Path admin_app\readme.txt -Value "elevated payload" -Encoding UTF8

      - name: 產生需要系統管理員權限的設定檔
        shell: pwsh
        run: |
          $config = @{
            app_dir          = "admin_app"
            png_icon         = "branding/icon.png"
            ico_icon         = "branding/icon.ico"
            app_name         = "MswiCiElevated"
            version          = "1.0.0"
            publisher        = "mswi-ci"
            exe_name         = "Setup_MswiCiElevated"
            main_exe         = "app.exe"
            # 預設值即為全機器安裝（Program Files + HKLM），這裡明確寫出來
            # 是因為這個 job 的全部意義就在於它是 false。
            no_admin_install = $false
            windows_service  = @{
              service_name      = "MswiCiElevatedSvc"
              exe_relative_path = "app.exe"
              start_type        = "demand"
            }
            create_restore_point_before_install = $true
          }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Path admin_config.json -Encoding UTF8
          Get-Content admin_config.json

      - name: 打包 Setup.exe
        run: python builder_cli.py pack --config admin_config.json

      - name: 靜默安裝
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\Setup_MswiCiElevated.exe" -ArgumentList "/S" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "靜默安裝回報失敗，exit code = $($proc.ExitCode)"
          }

      - name: 驗證安裝後的系統狀態
        shell: pwsh
        run: |
          $installDir = Join-Path $env:ProgramFiles "MswiCiElevated"
          $failures = @()

          function Check($name, $condition) {
            if ($condition) {
              Write-Host "PASS: $name"
            } else {
              Write-Host "FAIL: $name"
              $script:failures += $name
            }
          }

          Check "app.exe 存在於 Program Files 底下的安裝目錄" (Test-Path (Join-Path $installDir "app.exe"))
          Check "解除安裝登錄表項目存在（HKLM，no_admin_install=false）" `
            (Test-Path "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MswiCiElevated")
          Check "Windows 服務已註冊" ([bool](Get-Service -Name "MswiCiElevatedSvc" -ErrorAction SilentlyContinue))

          # 已知限制：System Restore/Volume Shadow Copy 在 GitHub 的
          # Windows Server 系 runner 上不保證存在，只警告不失敗。這一項
          # 終究要在真正的 Windows 用戶端機器上手動確認。
          try {
            $restorePoints = Get-ComputerRestorePoint -ErrorAction Stop
            if ($restorePoints) {
              Write-Host "PASS: 偵測到系統還原點"
            } else {
              Write-Host "WARN: 沒有偵測到系統還原點（Server 系 runner 上很可能是預期內的限制，不計入失敗）"
            }
          } catch {
            Write-Host "WARN: 無法查詢系統還原點（$($_.Exception.Message)，Server 系 runner 上很可能是預期內的限制，不計入失敗）"
          }

          if ($failures.Count -gt 0) {
            Write-Host "共 $($failures.Count) 項驗證失敗：$($failures -join '、')"
            exit 1
          }

      - name: 靜默解除安裝
        shell: pwsh
        run: |
          $installDir = Join-Path $env:ProgramFiles "MswiCiElevated"
          $proc = Start-Process -FilePath (Join-Path $installDir "uninstall.exe") -ArgumentList "--silent" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "靜默解除安裝回報失敗，exit code = $($proc.ExitCode)"
          }
          # 解除安裝會排程一個背景 .bat 刪除 uninstall.exe 自己（見
          # self_delete.py），給它幾秒鐘完成，下面的驗證才會準確。
          Start-Sleep -Seconds 5

      - name: 驗證解除安裝後已清乾淨
        shell: pwsh
        run: |
          $installDir = Join-Path $env:ProgramFiles "MswiCiElevated"
          $failures = @()

          function Check($name, $condition) {
            if ($condition) {
              Write-Host "PASS: $name"
            } else {
              Write-Host "FAIL: $name"
              $script:failures += $name
            }
          }

          Check "安裝目錄已移除" (-not (Test-Path $installDir))
          Check "解除安裝登錄表項目已移除" `
            (-not (Test-Path "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MswiCiElevated"))
          Check "Windows 服務已移除" (-not [bool](Get-Service -Name "MswiCiElevatedSvc" -ErrorAction SilentlyContinue))

          if ($failures.Count -gt 0) {
            Write-Host "共 $($failures.Count) 項驗證失敗：$($failures -join '、')"
            exit 1
          }

      - name: 收集安裝/解除安裝紀錄到工作目錄
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path admin_logs | Out-Null
          Copy-Item (Join-Path $env:TEMP "MswiCiElevated_silent_install_log.txt") admin_logs\ -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $env:TEMP "MswiCiElevated_uninstall_log.txt") admin_logs\ -ErrorAction SilentlyContinue

      - name: 上傳安裝/解除安裝紀錄（不管成功失敗都上傳，方便事後排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-admin-only-options-logs
          path: admin_logs\
          if-no-files-found: warn

  # MSIX 引擎的同一件事：實際打包一顆 MSIX 模式的 Setup.exe、靜默安裝到這台
  # 用完即丟的 runner 上、確認套件真的被 Windows 的套件引擎接收，再移除、
  # 確認清乾淨。
  #
  # 這個 job 取代了先前的一次性探針 workflow（spike-msix-deployment.yml）。
  # 探針問的是「這條路走不走得通」，八個問題都已經有答案；引擎實作完成之後
  # 需要的是「這條路現在還走得通嗎」——後者要跟著每次改動一起跑，因此併進
  # 這個 workflow，與傳統引擎的驗證放在一起。
  test-msix-engine:
    runs-on: windows-latest

    env:
      PYTHONUTF8: "1"
      # 憑證只存在於這台用完即丟的 runner 上，且僅供本次驗證使用；它不是
      # 散布方案（第二輪決議第一項：自簽憑證的定位是開發與測試手段）。
      MSWI_CI_CERT_PASSWORD: "mswi-ci-msix"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 套件與版本都寫在 requirements.txt，包含 winrt-* 那五個綁定套件
      # 以及它們固定版本的理由（見該檔說明）。
      - name: 安裝相依
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 吃自己的狗糧：SDK 工具用本專案的 fetch-sdk-tools 取得，等於一併驗證
      # ADR-0008 的取得流程在乾淨機器上仍然可用。
      - name: 取得 SDK 工具（makeappx／makepri／signtool）
        run: python builder_cli.py fetch-sdk-tools

      - name: 產生自簽測試憑證並讓這台機器信任它
        shell: pwsh
        run: |
          python .github\scripts\make_test_cert.py `
            --pfx ci.pfx --cer ci.cer `
            --password "$env:MSWI_CI_CERT_PASSWORD" `
            --common-name "MSWI CI MSIX" `
            --publisher-out publisher.txt
          # 未受信任的套件無法部署，這一步是必要的前置，不是在驗證信任機制。
          Import-Certificate -FilePath ci.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Import-Certificate -FilePath ci.cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Write-Host "發行者字串：$(Get-Content publisher.txt -Raw)"

      - name: 準備測試用的 app_dir
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app_dir | Out-Null
          Copy-Item "$env:WINDIR\System32\notepad.exe" app_dir\MswiCiMsix.exe
          Set-Content -Path app_dir\readme.txt -Value "ci payload" -Encoding UTF8
          python .github\scripts\make_ci_icons.py --png icon.png --ico icon.ico

      # certificate_subject 留空：驗證「工具會從憑證自動填入」這條路徑，
      # 那個字串的形式並不直覺（順序、分隔符、引號規則，見 cert_subject.py），
      # 讓 CI 自己填一份等於驗不到產品程式碼算得對不對。
      - name: 產生 MSIX 模式的設定檔
        shell: pwsh
        run: |
          $config = @{
            install_engine = "msix"
            app_dir        = (Resolve-Path app_dir).Path
            png_icon       = (Resolve-Path icon.png).Path
            ico_icon       = (Resolve-Path icon.ico).Path
            app_name       = "MSWI CI MSIX"
            version        = "1.2.3"
            publisher      = "MSWI CI"
            exe_name       = "Setup_MswiCiMsix"
            main_exe       = "MswiCiMsix.exe"
            no_admin_install = $true
            file_associations = ".mswicimsix"
            signing = @{
              cert_path         = (Resolve-Path ci.pfx).Path
              cert_password_env = "MSWI_CI_CERT_PASSWORD"
              timestamp_url     = "http://timestamp.digicert.com"
            }
            msix = @{
              identity_name       = "MswiCi.MsixEngineTest"
              certificate_subject = ""
            }
          }
          $config | ConvertTo-Json -Depth 6 | Set-Content -Path msix_config.json -Encoding UTF8
          Get-Content msix_config.json

      # 憑證在本機，因此走的是一體式路徑：一個指令從組裝套件、簽章、到編出
      # 內嵌它的 Setup.exe（第十三輪決議第一項）。
      - name: 一體式打包（產出已簽章的 .msix 並內嵌進 Setup.exe）
        run: python builder_cli.py pack --config msix_config.json

      - name: 確認產出物的形狀
        shell: pwsh
        run: |
          $failures = @()
          if (-not (Test-Path "dist\Setup_MswiCiMsix.exe")) { $failures += "沒有產出 Setup.exe" }
          # MSIX 模式不編 uninstall.exe（ADR-0006：解除安裝由系統接管）。
          if (Test-Path "dist\uninstall.exe") { $failures += "MSIX 模式不該產出 uninstall.exe" }
          $msix = Get-ChildItem -Filter "*.msix" | Select-Object -First 1
          if (-not $msix) { $failures += "找不到中間產物 .msix" }
          if ($failures.Count -gt 0) { throw ($failures -join "`n") }
          Write-Host "Setup.exe 大小：$((Get-Item 'dist\Setup_MswiCiMsix.exe').Length) bytes"

      - name: 靜默安裝
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\Setup_MswiCiMsix.exe" -ArgumentList "/S", "/LOG=$PWD\msix_silent_install.log" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "靜默安裝回報失敗，exit code = $($proc.ExitCode)"
          }

      - name: 驗證套件真的被系統接收
        shell: pwsh
        run: |
          $failures = @()
          $pkg = Get-AppxPackage -Name "MswiCi.MsixEngineTest" -ErrorAction SilentlyContinue
          if (-not $pkg) {
            $failures += "Get-AppxPackage 找不到這個套件——部署沒有真的發生"
          } else {
            Write-Host "PackageFullName : $($pkg.PackageFullName)"
            Write-Host "InstallLocation : $($pkg.InstallLocation)"
            Write-Host "Publisher       : $($pkg.Publisher)"
            # 版本號要被正規化成四段（MSIX 的要求，見 msix_settings.to_quad_version）
            if ($pkg.Version -ne "1.2.3.0") { $failures += "版本號是 $($pkg.Version)，預期 1.2.3.0" }
            # 發行者必須與憑證一致，否則系統根本不會收——這裡再確認一次是為了
            # 讓「自動從憑證填入」那條路徑失效時，錯誤指向正確的原因。
            $expected = (Get-Content publisher.txt -Raw).Trim()
            if ($pkg.Publisher -ne $expected) {
              $failures += "發行者是 $($pkg.Publisher)，憑證上是 $expected"
            }
            if (-not (Test-Path $pkg.InstallLocation)) { $failures += "安裝位置不存在" }
            if (-not (Test-Path (Join-Path $pkg.InstallLocation "MswiCiMsix.exe"))) {
              $failures += "套件裡沒有主執行檔"
            }
          }
          if ($failures.Count -gt 0) { throw ($failures -join "`n") }
          Write-Host "套件已由 Windows 的套件引擎接收。"

      # MSIX 模式沒有自訂的解除安裝介面（ADR-0006），移除由系統負責。
      - name: 移除套件並確認清乾淨
        shell: pwsh
        run: |
          $pkg = Get-AppxPackage -Name "MswiCi.MsixEngineTest"
          Remove-AppxPackage -Package $pkg.PackageFullName
          Start-Sleep -Seconds 2
          $still = Get-AppxPackage -Name "MswiCi.MsixEngineTest" -ErrorAction SilentlyContinue
          if ($still) { throw "移除之後套件還在：$($still.PackageFullName)" }
          Write-Host "已移除，且系統中不再有這個套件。"

      # --- 憑證存放區模式（docs/adr/0014）-------------------------------
      #
      # 上面走的是憑證檔案模式（cert_path + 密碼環境變數）。存放區模式是 S1
      # 之後建議採用的那一條——私鑰由作業系統保管，命令列上不出現密碼——因此
      # 它也需要在乾淨機器上被跑過一次。
      #
      # 用完整的 pack 而不是 pack-msix：後者按定義一律不簽章（要留給雲端代簽
      # 的情境），拿它驗簽章等於驗一件不會發生的事。
      #
      # 排在最後：build_all() 每次開頭都會清空 dist/，放前面會把上面幾個步驟
      # 正在斷言的那顆 Setup.exe 刪掉。
      - name: 把測試憑證匯入個人存放區
        shell: pwsh
        run: |
          $pw = ConvertTo-SecureString -String "$env:MSWI_CI_CERT_PASSWORD" -Force -AsPlainText
          $imported = Import-PfxCertificate -FilePath ci.pfx `
            -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          $imported.Thumbprint | Set-Content -Path thumbprint.txt -Encoding ASCII
          Write-Host "指紋：$($imported.Thumbprint)"

      # 這個子指令是 cert_thumbprint 那個欄位的值的來源（ADR-0014 決定五）。
      # 清單依加強金鑰使用方法篩選，剛匯入的這張帶程式碼簽章用途，列得出來。
      - name: list-certs 找得到剛匯入的那一張
        shell: pwsh
        run: |
          $thumb = (Get-Content thumbprint.txt -Raw).Trim()
          $output = python builder_cli.py list-certs 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch [regex]::Escape($thumb)) {
            throw "list-certs 沒有列出剛匯入的憑證（$thumb）"
          }

      # certificate_subject 一樣留空：存放區模式下自動填入走的是另一條路
      # （從存放區的憑證讀，不是從 .pfx 讀），那條路也要驗到。
      - name: 存放區模式一體式打包
        shell: pwsh
        run: |
          $thumb = (Get-Content thumbprint.txt -Raw).Trim()
          $config = @{
            install_engine = "msix"
            app_dir        = (Resolve-Path app_dir).Path
            png_icon       = (Resolve-Path icon.png).Path
            ico_icon       = (Resolve-Path icon.ico).Path
            app_name       = "MSWI CI MSIX Store"
            version        = "1.2.4"
            publisher      = "MSWI CI"
            exe_name       = "Setup_MswiCiMsixStore"
            main_exe       = "MswiCiMsix.exe"
            no_admin_install = $true
            signing = @{
              cert_thumbprint = $thumb
              timestamp_url   = "http://timestamp.digicert.com"
            }
            msix = @{
              identity_name       = "MswiCi.MsixStoreModeTest"
              certificate_subject = ""
            }
          }
          $config | ConvertTo-Json -Depth 6 | Set-Content -Path store_config.json -Encoding UTF8
          Get-Content store_config.json
          python builder_cli.py pack --config store_config.json

      - name: 確認兩份產物都由那張憑證簽章
        shell: pwsh
        run: |
          $failures = @()
          $expectedThumb = (Get-Content thumbprint.txt -Raw).Trim()

          # build_all 在存放區模式下要簽兩樣東西：內嵌的 .msix 與 Setup.exe。
          # signtool 的 /sha1 若沒有真的生效，這裡會抓到——產物可能完全沒有
          # 簽章，也可能簽到別張憑證。
          #
          # 斷言的是簽章者的指紋，不是 $sig.Status：Status 反映的是「這台機器
          # 信不信任這條憑證鏈」，那是另一件事（本機實測未匯入信任存放區時
          # 為 UnknownError，但 SignerCertificate 照樣讀得出來）。拿 Status 當
          # 判準會讓這一步的成敗取決於信任設定，而不是簽章有沒有簽對。
          $targets = @()
          $msix = Get-ChildItem -Recurse -Filter "MswiCi.MsixStoreModeTest*.msix" |
            Select-Object -First 1
          if ($msix) { $targets += $msix.FullName } else { $failures += "找不到 .msix" }
          if (Test-Path "dist\Setup_MswiCiMsixStore.exe") {
            $targets += (Resolve-Path "dist\Setup_MswiCiMsixStore.exe").Path
          } else { $failures += "沒有產出 Setup.exe" }

          foreach ($t in $targets) {
            $sig = Get-AuthenticodeSignature -FilePath $t
            Write-Host "$([System.IO.Path]::GetFileName($t))：$($sig.Status)"
            if (-not $sig.SignerCertificate) {
              $failures += "$t 沒有簽章"
            } elseif ($sig.SignerCertificate.Thumbprint -ne $expectedThumb) {
              $failures += "$t 的簽章者是 $($sig.SignerCertificate.Thumbprint)，預期 $expectedThumb"
            }
          }

          # 發行者自動填入：存放區模式下讀的是存放區裡的憑證，不是 .pfx。
          if ($msix) {
            $expectedPublisher = (Get-Content publisher.txt -Raw).Trim()
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
            try {
              $entry = $zip.Entries | Where-Object { $_.FullName -eq 'AppxManifest.xml' }
              $reader = New-Object System.IO.StreamReader($entry.Open())
              $manifest = $reader.ReadToEnd()
              $reader.Dispose()
            } finally { $zip.Dispose() }
            if ($manifest -notmatch [regex]::Escape($expectedPublisher)) {
              $failures += "套件清單的發行者不是憑證上的字串（預期 $expectedPublisher）"
            }
          }

          if ($failures.Count -gt 0) { throw ($failures -join "`n") }
          Write-Host "存放區模式：兩份產物皆由指定的憑證簽章，發行者自動填入正確。"

      - name: 上傳安裝紀錄（不管成功失敗都上傳，方便事後排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msix-engine-logs
          path: msix_silent_install.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 安裝密碼保護（install_password_env）。
  #
  # 這個欄位的失敗方式是安靜的：加密沒有生效時，安裝檔照樣編得出來、照樣裝
  # 得起來、行為看起來一模一樣，只是保護不存在。因此這裡驗的重點不是「帶對
  # 密碼裝得起來」，而是「沒有密碼裝不起來」與「應用程式內容真的不是明文躺
  # 在 exe 裡」。
  #
  # 明文檢查帶一個對照組：同一份 app_dir 另外編一顆不開保護的，那顆裡面必須
  # 找得到明文標記。找不到的話代表這段搜尋壞了，而不是加密生效了——兩者在
  # 結果上長得一樣（同一個陷阱在 tools/verify_upgrade_install.py 真的踩過）。
  test-install-password:
    runs-on: windows-latest

    env:
      PYTHONUTF8: "1"
      # 密碼本身不放進設定檔，只放環境變數名稱（見 CLI_USAGE 的
      # install_password_env）。
      MSWI_CI_INSTALL_PASSWORD: "ci-install-password-2026"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 準備測試用的 app_dir（含一個明文標記）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pw_app | Out-Null
          Copy-Item "$env:WINDIR\System32\notepad.exe" "pw_app\app.exe"
          # 這串字只存在於這個檔案裡，用來判斷應用程式內容有沒有以明文被
          # 帶進 exe。挑一個不會在其他地方偶然出現的形狀。
          Set-Content -Path "pw_app\canary.txt" `
            -Value "MSWI-PLAINTEXT-CANARY-9f3ad271" -Encoding ASCII

      - name: 打包兩顆——一顆開密碼保護，一顆不開（對照組）
        shell: pwsh
        run: |
          $common = @{
            app_dir   = "pw_app"
            png_icon  = "branding/icon.png"
            ico_icon  = "branding/icon.ico"
            version   = "1.0.0"
            publisher = "mswi-ci"
            main_exe  = "app.exe"
            # runner 是無人值守環境，沒有人可以回應提權要求。
            no_admin_install = $true
          }

          $protectedConfig = $common.Clone()
          $protectedConfig.app_name = "MswiCiPassword"
          $protectedConfig.exe_name = "Setup_MswiCiPassword"
          $protectedConfig.install_password_env = "MSWI_CI_INSTALL_PASSWORD"
          $protectedConfig | ConvertTo-Json -Depth 5 |
            Set-Content -Path pw_config.json -Encoding UTF8

          $plainConfig = $common.Clone()
          $plainConfig.app_name = "MswiCiPlain"
          $plainConfig.exe_name = "Setup_MswiCiPlain"
          $plainConfig | ConvertTo-Json -Depth 5 |
            Set-Content -Path plain_config.json -Encoding UTF8

          # 每編完一顆就立刻搬走：builder_cli.py pack 底層的 build_all() 開頭會
          # 清空整個 dist/，第二次打包會把第一顆砍掉（2026-09-08 實際踩到，
          # 症狀是後面的步驟回報「找不到檔案」，不會指向這個原因）。
          New-Item -ItemType Directory -Force -Path pw_out | Out-Null

          python builder_cli.py pack --config pw_config.json
          if ($LASTEXITCODE -ne 0) { throw "打包（開保護）失敗" }
          Move-Item "dist\Setup_MswiCiPassword.exe" "pw_out\Setup_MswiCiPassword.exe" -Force

          python builder_cli.py pack --config plain_config.json
          if ($LASTEXITCODE -ne 0) { throw "打包（對照組）失敗" }
          Move-Item "dist\Setup_MswiCiPlain.exe" "pw_out\Setup_MswiCiPlain.exe" -Force

          Get-ChildItem pw_out | ForEach-Object { Write-Host ("{0}  {1:N0} bytes" -f $_.Name, $_.Length) }

      - name: 應用程式內容真的被加密了（含對照組）
        shell: pwsh
        run: |
          # 驗的是**內嵌資源的名字**，不是搜尋明文內容。PyInstaller 的 onefile
          # 封存會壓縮每一筆內容，因此就算完全沒有加密，app_dir 裡的明文也不會
          # 以原樣出現在 exe 的位元組裡（2026-09-09 實測確認）——用明文當標記的
          # 話，對照組會失敗，而那個檢查等於什麼都證明不了。
          #
          # 資源名稱則是未壓縮儲存的，而且那兩個名字是 embedded_payload 的模組
          # 說明明文記載的「打包端與安裝端之間的契約」：PLAIN 內嵌
          # app_contents/ 整個目錄，ENCRYPTED 內嵌單一的 app_contents.enc。
          function ContainsText($path, $needle) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            return [System.Text.Encoding]::Latin1.GetString($bytes).Contains($needle)
          }

          $plainEntry = "app_contents\canary.txt"
          $failures = @()

          # 對照組先跑：這一段搜尋要先證明它抓得到東西。找不到就代表搜尋本身
          # 壞了，此時另一顆的「找不到」什麼都不能說明——兩者在結果上長得一樣。
          if (-not (ContainsText "pw_out\Setup_MswiCiPlain.exe" $plainEntry)) {
            $failures += "對照組（未開保護）裡找不到 $plainEntry 這筆資源——這段搜尋本身沒有作用，加密與否無從判斷"
          } else {
            Write-Host "PASS: 對照組裡找得到明文內容的資源項目，搜尋有效"
          }

          if (ContainsText "pw_out\Setup_MswiCiPassword.exe" $plainEntry) {
            $failures += "開了密碼保護的安裝檔裡仍有 $plainEntry——應用程式內容是以明文目錄內嵌的，沒有走加密那一條"
          } else {
            Write-Host "PASS: 開了保護的安裝檔裡沒有明文內容的資源項目"
          }

          if (-not (ContainsText "pw_out\Setup_MswiCiPassword.exe" "app_contents.enc")) {
            $failures += "開了密碼保護的安裝檔裡找不到 app_contents.enc——加密後的檔案根本沒有被內嵌"
          } else {
            Write-Host "PASS: 開了保護的安裝檔內嵌的是 app_contents.enc"
          }

          if ($failures.Count -gt 0) { throw ($failures -join "`n") }

      - name: 沒帶密碼裝不起來
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\MswiCiPassword"
          $proc = Start-Process -FilePath "pw_out\Setup_MswiCiPassword.exe" `
            -ArgumentList "/S" -Wait -PassThru
          if ($proc.ExitCode -eq 0) {
            throw "沒帶 /PASSWORD= 卻回報安裝成功（exit code 0）"
          }
          if (Test-Path $installDir) {
            throw "沒帶密碼卻在 $installDir 留下了東西"
          }
          Write-Host "PASS: 沒帶密碼時以 exit code $($proc.ExitCode) 中止，且沒有落地"

      - name: 密碼錯了也裝不起來
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\MswiCiPassword"
          $proc = Start-Process -FilePath "pw_out\Setup_MswiCiPassword.exe" `
            -ArgumentList "/S", "/PASSWORD=definitely-not-the-password" -Wait -PassThru
          if ($proc.ExitCode -eq 0) {
            throw "密碼錯誤卻回報安裝成功（exit code 0）"
          }
          if (Test-Path $installDir) {
            throw "密碼錯誤卻在 $installDir 留下了東西"
          }
          Write-Host "PASS: 密碼錯誤時以 exit code $($proc.ExitCode) 中止，且沒有落地"

      - name: 帶對密碼裝得起來，而且解得出原本的內容
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\MswiCiPassword"
          $proc = Start-Process -FilePath "pw_out\Setup_MswiCiPassword.exe" `
            -ArgumentList "/S", "/PASSWORD=$env:MSWI_CI_INSTALL_PASSWORD", `
                          "/LOG=pw_silent_install.log" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "帶對密碼仍然失敗，exit code = $($proc.ExitCode)"
          }

          $failures = @()
          if (-not (Test-Path (Join-Path $installDir "app.exe"))) {
            $failures += "app.exe 不在安裝目錄裡"
          }
          # 解密之後的內容要與加密之前完全相同。只檢查檔案存在的話，一個
          # 空檔案或壞掉的內容都會通過。
          $canaryPath = Join-Path $installDir "canary.txt"
          if (-not (Test-Path $canaryPath)) {
            $failures += "canary.txt 不在安裝目錄裡"
          } elseif ((Get-Content $canaryPath -Raw).Trim() -ne "MSWI-PLAINTEXT-CANARY-9f3ad271") {
            $failures += "canary.txt 的內容與加密之前不同——解密沒有還原出原本的檔案"
          }
          if ($failures.Count -gt 0) { throw ($failures -join "`n") }
          Write-Host "PASS: 帶對密碼安裝成功，解密後的內容與原本一致"

      - name: 靜默解除安裝並確認清乾淨
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\MswiCiPassword"
          $proc = Start-Process -FilePath (Join-Path $installDir "uninstall.exe") `
            -ArgumentList "--silent" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "靜默解除安裝回報失敗，exit code = $($proc.ExitCode)"
          }
          # 解除安裝會排程一個背景 .bat 刪掉 uninstall.exe 自己（見
          # self_delete.py），給它幾秒鐘完成。
          Start-Sleep -Seconds 5
          if (Test-Path $installDir) {
            throw "安裝目錄仍然存在：$installDir"
          }
          Write-Host "PASS: 解除安裝完成，安裝目錄已清除"

      - name: 上傳安裝紀錄（不管成功失敗都上傳，方便事後排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-password-logs
          path: pw_silent_install.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 安裝失敗時的回滾，以及捷徑。
  #
  # 捷徑在此之前任何地方都沒有被斷言過，而它是使用者裝完之後第一個會去找的
  # 東西；產品裡捷徑建立失敗是「吞掉例外、記一則警告」，安裝照樣回報成功。
  #
  # 回滾要驗的是「失敗之後那些東西都不見了」，而「不見了」與「我根本找錯
  # 地方」在結果上長得一樣。因此先跑一次正常安裝當對照組——那一輪同時就是
  # 捷徑的涵蓋——再跑一次刻意失敗的，驗同樣那幾條全部落空。
  test-rollback-and-shortcuts:
    runs-on: windows-latest

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 準備測試用的 app_dir
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path rb_app | Out-Null
          Copy-Item "$env:WINDIR\System32\notepad.exe" "rb_app\app.exe"
          Set-Content -Path "rb_app\data.txt" -Value "rollback probe" -Encoding ASCII

      - name: 打包
        shell: pwsh
        run: |
          $config = @{
            app_dir           = "rb_app"
            png_icon          = "branding/icon.png"
            ico_icon          = "branding/icon.ico"
            app_name          = "MswiCiRollback"
            version           = "1.0.0"
            publisher         = "mswi-ci"
            exe_name          = "Setup_MswiCiRollback"
            main_exe          = "app.exe"
            add_to_path       = $true
            file_associations = ".mswiroll"
            # runner 是無人值守環境，沒有人可以回應提權要求。
            no_admin_install  = $true
          }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Path rb_config.json -Encoding UTF8
          python builder_cli.py pack --config rb_config.json
          if ($LASTEXITCODE -ne 0) { throw "打包失敗" }
          # 搬出 dist：後面沒有第二次打包，但 dist/ 的內容不該被當成穩定的
          # 落腳處（build_all() 每次開頭都會清空它）。
          New-Item -ItemType Directory -Force -Path rb_out | Out-Null
          Move-Item "dist\Setup_MswiCiRollback.exe" "rb_out\Setup_MswiCiRollback.exe" -Force

      - name: 對照組——正常安裝，捷徑與登錄表都要在
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "rb_out\Setup_MswiCiRollback.exe" `
            -ArgumentList "/S", "/LOG=rb_install.log" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "正常安裝就失敗了，exit code = $($proc.ExitCode)"
          }

          $installDir = Join-Path $env:LOCALAPPDATA "Programs\MswiCiRollback"
          $startMenu  = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\MswiCiRollback.lnk"
          $desktop    = Join-Path $env:USERPROFILE "Desktop\MswiCiRollback.lnk"
          $key        = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MswiCiRollback"

          $failures = @()
          if (-not (Test-Path (Join-Path $installDir "app.exe"))) { $failures += "app.exe 不在安裝目錄裡" }
          if (-not (Test-Path $key)) { $failures += "解除安裝登錄表項目不存在" }
          # 這兩條是這個專案第一次真的去看捷徑在不在。
          if (-not (Test-Path $startMenu)) { $failures += "開始功能表捷徑不存在：$startMenu" }
          if (-not (Test-Path $desktop))   { $failures += "桌面捷徑不存在：$desktop" }
          $userPath = (Get-ItemProperty 'HKCU:\Environment' -Name Path -ErrorAction SilentlyContinue).Path
          if (-not ($userPath -and ($userPath -split ';' | Where-Object { $_.TrimEnd('\') -eq $installDir.TrimEnd('\') }))) {
            $failures += "PATH 裡沒有安裝目錄"
          }
          if ($failures.Count -gt 0) { throw ($failures -join "`n") }
          Write-Host "PASS: 正常安裝——app.exe、登錄表項目、開始功能表捷徑、桌面捷徑、PATH 全部到位"

      - name: 對照組——解除安裝，捷徑也要跟著消失
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\MswiCiRollback"
          $proc = Start-Process -FilePath (Join-Path $installDir "uninstall.exe") `
            -ArgumentList "--silent" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "靜默解除安裝失敗，exit code = $($proc.ExitCode)" }
          # 解除安裝會排程一個背景 .bat 刪掉 uninstall.exe 自己（見 self_delete.py）。
          Start-Sleep -Seconds 6

          $startMenu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\MswiCiRollback.lnk"
          $desktop   = Join-Path $env:USERPROFILE "Desktop\MswiCiRollback.lnk"
          $failures = @()
          if (Test-Path $installDir) { $failures += "安裝目錄仍然存在" }
          if (Test-Path $startMenu)  { $failures += "開始功能表捷徑殘留" }
          if (Test-Path $desktop)    { $failures += "桌面捷徑殘留" }
          if ($failures.Count -gt 0) { throw ($failures -join "`n") }
          Write-Host "PASS: 解除安裝——安裝目錄與兩個捷徑都已清除"

      - name: 讓安裝在最後一步失敗，然後驗回滾
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\MswiCiRollback"
          # 安裝的最後一步是把 install_manifest.json 寫進安裝目錄。事先在那個
          # 位置放一個**同名的資料夾**，那一步就會拋出 OSError——而複製檔案、
          # 登錄表、捷徑、檔案關聯、PATH 全都已經寫進去了，正好是回滾要清的
          # 全部。後置腳本失敗只算警告、不觸發回滾，所以不能用那個當觸發點。
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $installDir "install_manifest.json") | Out-Null
          # 一個事先就存在的檔案，用來確認回滾不會順手清掉不屬於這次安裝的東西。
          Set-Content -Path (Join-Path $installDir "pre_existing.txt") `
            -Value "not ours" -Encoding ASCII

          $proc = Start-Process -FilePath "rb_out\Setup_MswiCiRollback.exe" `
            -ArgumentList "/S", "/LOG=rb_rollback.log" -Wait -PassThru
          Write-Host "安裝結束碼：$($proc.ExitCode)"
          if ($proc.ExitCode -eq 0) {
            throw "最後一步應該要失敗，卻回報成功（exit code 0）——這一輪沒有觸發到回滾，後面的檢查沒有意義"
          }

          $startMenu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\MswiCiRollback.lnk"
          $desktop   = Join-Path $env:USERPROFILE "Desktop\MswiCiRollback.lnk"
          $key       = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MswiCiRollback"

          $failures = @()
          if (Test-Path (Join-Path $installDir "app.exe")) { $failures += "app.exe 沒有被回滾掉" }
          if (Test-Path (Join-Path $installDir "data.txt")) { $failures += "data.txt 沒有被回滾掉" }
          if (Test-Path $key) { $failures += "解除安裝登錄表項目沒有被回滾掉" }
          if (Test-Path $startMenu) { $failures += "開始功能表捷徑沒有被回滾掉" }
          if (Test-Path $desktop) { $failures += "桌面捷徑沒有被回滾掉" }
          $userPath = (Get-ItemProperty 'HKCU:\Environment' -Name Path -ErrorAction SilentlyContinue).Path
          if ($userPath -and ($userPath -split ';' | Where-Object { $_.TrimEnd('\') -eq $installDir.TrimEnd('\') })) {
            $failures += "PATH 裡的安裝目錄沒有被回滾掉"
          }
          # 反過來的一項：回滾只該清這次安裝寫入的東西。
          if (-not (Test-Path (Join-Path $installDir "pre_existing.txt"))) {
            $failures += "回滾清掉了安裝之前就存在的檔案"
          }
          if ($failures.Count -gt 0) { throw ($failures -join "`n") }
          Write-Host "PASS: 回滾——檔案、登錄表項目、兩個捷徑、PATH 都已復原，且沒有動到事先存在的檔案"

      - name: 收尾（把刻意留下的障礙物清掉）
        if: always()
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\MswiCiRollback"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue }

      - name: 上傳安裝紀錄（不管成功失敗都上傳，方便事後排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollback-shortcuts-logs
          path: |
            rb_install.log
            rb_rollback.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 相依元件：dependencies / custom_dependencies / bundle_dependencies。
  #
  # 這一組欄位在此之前完全沒有被任何自動化碰過，而它們的失敗方式是安靜的：
  # 偵測沒接上時安裝照樣成功，只是那則「建議先安裝」永遠不出現；內嵌沒生效
  # 時安裝檔照樣編得出來，只是它在離線的機器上會去下載一個下載不到的東西。
  #
  # 偵測那一段用**同一顆安裝檔**跑兩次，中間只差一個登錄表機碼。同一顆
  # 安裝檔、同一個指令，輸出卻不同——那是「偵測真的有在跑」唯一不靠推論的
  # 證據。不下載任何東西，因此也不受網路狀況影響。
  test-dependencies:
    runs-on: windows-latest

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 準備 app_dir 與兩份設定（自訂相依元件、以及要不要內嵌）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dep_app | Out-Null
          Copy-Item "$env:WINDIR\System32\notepad.exe" "dep_app\app.exe"

          # 自訂相依元件：偵測指向一個我們自己控制的 HKCU 機碼，因此「裝了
          # 沒」完全由這個 job 決定，不看這台 runner 上實際裝了什麼。
          # download_url 必須是 https（打包階段會驗），但這一輪不會真的去下載
          # ——偵測說已安裝時不下載，偵測說缺少時靜默安裝也只是記一則警告。
          $custom = @(@{
            key            = "mswi_ci_probe_dep"
            display_name   = "MSWI CI Probe Dependency"
            download_url   = "https://example.invalid/mswi-ci-probe.exe"
            registry_check = @{ hive = "HKCU"; path = "Software\MswiCiDepProbe" }
          })

          # custom_dependencies 只是**定義**，還要在 dependencies 清單裡列出來
          # 才會被檢查（get_warnings() 走的是 dependencies，custom_dependencies
          # 只提供 checker）。漏了這一行的話那一筆完全不會有作用，而打包階段
          # 不會提醒——2026-09-09 就是這樣紅了一次。
          $base = @{
            app_dir             = "dep_app"
            png_icon            = "branding/icon.png"
            ico_icon            = "branding/icon.ico"
            version             = "1.0.0"
            publisher           = "mswi-ci"
            main_exe            = "app.exe"
            no_admin_install    = $true
            custom_dependencies = $custom
            dependencies        = @("mswi_ci_probe_dep")
          }

          $plain = $base.Clone()
          $plain.app_name = "MswiCiDeps"
          $plain.exe_name = "Setup_MswiCiDeps"
          $plain | ConvertTo-Json -Depth 6 | Set-Content -Path dep_config.json -Encoding UTF8

          # 內嵌那一顆：多帶 bundle_dependencies。這一步會在打包當下真的把
          # VC++ Redistributable 下載下來內嵌進去。
          $bundled = $base.Clone()
          $bundled.app_name             = "MswiCiDepsBundled"
          $bundled.exe_name             = "Setup_MswiCiDepsBundled"
          $bundled.dependencies         = @("mswi_ci_probe_dep", "vcredist_x64")
          $bundled.bundle_dependencies  = @("vcredist_x64")
          $bundled | ConvertTo-Json -Depth 6 | Set-Content -Path dep_bundled_config.json -Encoding UTF8

      - name: 打包兩顆
        shell: pwsh
        run: |
          # 每編完一顆就立刻搬走：build_all() 開頭會清空整個 dist/。
          New-Item -ItemType Directory -Force -Path dep_out | Out-Null

          python builder_cli.py pack --config dep_config.json
          if ($LASTEXITCODE -ne 0) { throw "打包（未內嵌）失敗" }
          Move-Item "dist\Setup_MswiCiDeps.exe" "dep_out\Setup_MswiCiDeps.exe" -Force

          python builder_cli.py pack --config dep_bundled_config.json
          if ($LASTEXITCODE -ne 0) { throw "打包（內嵌）失敗" }
          Move-Item "dist\Setup_MswiCiDepsBundled.exe" "dep_out\Setup_MswiCiDepsBundled.exe" -Force

          Get-ChildItem dep_out | ForEach-Object { Write-Host ("{0}  {1:N0} bytes" -f $_.Name, $_.Length) }

      - name: 內嵌的相依元件真的在安裝檔裡（含對照組）
        shell: pwsh
        run: |
          # 與密碼保護那個 job 同一個作法：驗**內嵌資源的名字**。PyInstaller
          # 會壓縮每一筆內容，明文搜尋不到；資源名稱則是未壓縮儲存的。
          # 這個名字是打包端與安裝端之間的契約——installer_core 的
          # install_dependency() 查的固定路徑就是 dependencies/<key>.exe。
          function ContainsText($path, $needle) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            return [System.Text.Encoding]::Latin1.GetString($bytes).Contains($needle)
          }

          $entry = "dependencies\vcredist_x64.exe"
          $failures = @()

          # 對照組先跑：沒有帶 bundle_dependencies 的那顆**不該**有這筆資源。
          # 它要是也有，代表這段搜尋比對到的是別的東西，另一顆的「有」就不能
          # 當成內嵌成功的證據。
          if (ContainsText "dep_out\Setup_MswiCiDeps.exe" $entry) {
            $failures += "沒有帶 bundle_dependencies 的安裝檔裡也有 $entry——這段搜尋比對到的不是內嵌的那份"
          } else {
            Write-Host "PASS: 對照組（未內嵌）裡沒有這筆資源"
          }

          if (-not (ContainsText "dep_out\Setup_MswiCiDepsBundled.exe" $entry)) {
            $failures += "帶了 bundle_dependencies 卻找不到 $entry——相依元件沒有被內嵌"
          } else {
            Write-Host "PASS: 內嵌的那顆裡有 $entry"
          }

          # 內嵌的是一顆二十幾 MB 的安裝檔，兩顆的大小差距應該看得出來。
          $plainSize = (Get-Item "dep_out\Setup_MswiCiDeps.exe").Length
          $bundledSize = (Get-Item "dep_out\Setup_MswiCiDepsBundled.exe").Length
          Write-Host ("未內嵌 {0:N0}／內嵌 {1:N0}，差 {2:N0} bytes" -f $plainSize, $bundledSize, ($bundledSize - $plainSize))
          if (($bundledSize - $plainSize) -lt 5000000) {
            $failures += "兩顆的大小只差 $($bundledSize - $plainSize) bytes，內嵌的東西看起來不在裡面"
          }

          if ($failures.Count -gt 0) { throw ($failures -join "`n") }

      - name: 偵測到「已安裝」時不提示（同一顆安裝檔，第一次）
        shell: pwsh
        run: |
          # 這一輪的斷言是「紀錄裡沒有那則提示」，單看是空的——偵測根本沒接上
          # 時它也會通過（2026-09-09 就是這樣：這一輪綠、下一輪紅，紅的那個
          # 才是真的在驗）。它的意義來自與下一輪的對照：同一顆安裝檔、同一個
          # 指令，只差一個登錄表機碼，輸出卻不同。兩輪都要通過才算數。
          # 先把偵測要找的機碼建起來，讓這個自訂相依元件被判定為已安裝。
          New-Item -Path "HKCU:\Software\MswiCiDepProbe" -Force | Out-Null

          $proc = Start-Process -FilePath "dep_out\Setup_MswiCiDeps.exe" `
            -ArgumentList "/S", "/LOG=dep_present.log" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "安裝失敗，exit code = $($proc.ExitCode)" }

          $log = Get-Content dep_present.log -Raw -Encoding UTF8
          if ($log -match "MSWI CI Probe Dependency") {
            throw "偵測說它已安裝，紀錄裡卻仍然出現「建議先安裝」的提示"
          }
          Write-Host "PASS: 偵測到已安裝時沒有提示"

          # 收尾，讓下一輪從乾淨狀態開始。
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\MswiCiDeps"
          $proc = Start-Process -FilePath (Join-Path $installDir "uninstall.exe") `
            -ArgumentList "--silent" -Wait -PassThru
          Start-Sleep -Seconds 5

      - name: 偵測到「缺少」時會提示（同一顆安裝檔，第二次）
        shell: pwsh
        run: |
          # 這一輪與上一輪唯一的差別就是這個機碼不見了。同一顆安裝檔、同一個
          # 指令，輸出卻不同——那是「偵測真的有在跑」唯一不靠推論的證據。
          Remove-Item "HKCU:\Software\MswiCiDepProbe" -Recurse -Force -ErrorAction SilentlyContinue

          $proc = Start-Process -FilePath "dep_out\Setup_MswiCiDeps.exe" `
            -ArgumentList "/S", "/LOG=dep_missing.log" -Wait -PassThru
          # 相依元件缺少只會記錄警告、不阻擋安裝（靜默模式沒有畫面可以提示）。
          if ($proc.ExitCode -ne 0) { throw "相依元件缺少不該讓安裝失敗，exit code = $($proc.ExitCode)" }

          $log = Get-Content dep_missing.log -Raw -Encoding UTF8
          $failures = @()
          if ($log -notmatch "MSWI CI Probe Dependency") {
            $failures += "偵測說它缺少，紀錄裡卻沒有出現那則提示——自訂相依元件根本沒有被檢查"
          }
          if ($log -notmatch "example\.invalid") {
            $failures += "提示裡沒有帶上下載連結，使用者拿不到「去哪裡裝」"
          }
          if ($failures.Count -gt 0) { throw ($failures -join "`n") }
          Write-Host "PASS: 偵測到缺少時提示了，而且帶著下載連結"

      - name: 收尾
        if: always()
        shell: pwsh
        run: |
          Remove-Item "HKCU:\Software\MswiCiDepProbe" -Recurse -Force -ErrorAction SilentlyContinue
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\MswiCiDeps"
          if (Test-Path $installDir) {
            $u = Join-Path $installDir "uninstall.exe"
            if (Test-Path $u) { Start-Process -FilePath $u -ArgumentList "--silent" -Wait }
            Start-Sleep -Seconds 5
            Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: 上傳安裝紀錄（不管成功失敗都上傳，方便事後排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-logs
          path: |
            dep_present.log
            dep_missing.log
