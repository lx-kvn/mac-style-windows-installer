<!--
    uninstall.html — 解除安裝助手介面（跟 index.html 共用同一套 macOS 風格
    彈窗語彙：字型堆疊、色票、.nice-modal-*、藥丸按鈕、frameless + 自訂拖曳 +
    左上角 X 關閉）。

    在此之前 uninstall.exe 是純 console 程式（builder.py 沒有給它加
    --noconsole），互動流程全部靠原生 MessageBoxW，雙擊執行還會跳出一個
    黑底命令提示字元視窗——跟 Setup.exe 那套精緻的拖曳安裝畫面完全是兩個
    世界。這支頁面 + uninstall.py 的 UninstallerAPI 就是要補上這塊，讓解除
    安裝的視覺語言跟安裝時一致，不再是「兩套系統拼在一起」。

    畫面流程（同一個 HTML 裡用 class 切換顯示，不是分開的視窗）：
    confirmView（預設）→（視情況）processRunningModal 或
    lockingProcessesModal → progressView → doneModal / errorModal。
-->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>解除安裝</title>
    <style>
        * { box-sizing: border-box; }
        /* 這支視窗本身就是唯一的內容（不像 index.html 的彈窗是疊在主安裝畫面
           上方的一層），所以視窗本身直接就是「卡片」——body 直接用白底填滿
           整個視窗，不再疊一層灰底畫布 + 裡面又放一張圓角白卡片，那樣在
           uninstall.exe 這種「整個視窗只有一個對話框」的情境下純粹是多餘的
           雙層框架，跟 Setup.exe 主安裝畫面（body 本身就是全螢幕內容）的
           做法其實才是一致的。 */
        body {
            margin: 0; padding: 0; background-color: white;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }
        .drag-region {
            position: fixed; top: 0; left: 0; width: 100%; height: 40px;
            z-index: 9998;
        }
        .custom-close-btn {
            position: fixed; top: 16px; left: 16px; width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border-radius: 50%; background-color: transparent; color: #8e8e93;
            transition: background-color 0.2s, color 0.2s; z-index: 9999;
        }
        .custom-close-btn:hover { background-color: rgba(0, 0, 0, 0.06); color: #1d1d1f; }
        .css-close-icon { position: relative; width: 10px; height: 10px; }
        .css-close-icon::before, .css-close-icon::after {
            content: ''; position: absolute; top: 50%; left: 0; width: 10px; height: 1.5px;
            background-color: currentColor; border-radius: 1px;
        }
        .css-close-icon::before { transform: translateY(-50%) rotate(45deg); }
        .css-close-icon::after { transform: translateY(-50%) rotate(-45deg); }

        /* 內容區塊本身不再是浮在畫布上的卡片（見上面 body 的說明），只負責
           版面排列：置中、限制文字寬度方便閱讀、內容過長時可以捲動。 */
        .nice-view {
            width: 100%; max-width: 480px; padding: 0 32px;
            max-height: calc(100vh - 32px); overflow-y: auto;
            text-align: center;
            display: none;
        }
        .nice-view.active { display: block; }
        .nice-icon {
            width: 44px; height: 44px; background: #34C759; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; margin: 0 auto 12px auto; color: white;
        }
        .nice-icon.error { background: #FF3B30; }
        .nice-icon.warn { background: #FF9500; }
        .nice-title { font-size: 17px; font-weight: 600; color: #1d1d1f; margin-bottom: 6px; }
        .nice-message { font-size: 13px; color: #86868b; margin-bottom: 20px; text-align: left; line-height: 1.6; }
        .nice-btn {
            background: #0071e3; color: white; border: none; padding: 8px 24px;
            border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer;
            transition: background 0.2s; outline: none; margin: 0 4px;
        }
        /* 解除安裝完成但有幾項沒清乾淨時的殘留清單（F01）。跟 index.html 的
           .warn-list 是同一套視覺與同一組限制：視窗固定 600x420、不可調整
           大小，清單項目數不可預期（六個移除步驟＋每個刪不掉的檔案各一項），
           所以限制高度並允許自己捲動，不讓清單把「完成」按鈕擠出畫面。
           overflow-wrap: anywhere 給檔案路徑、服務名稱這類沒有空白可斷行的
           長字串用，避免最窄寬度下文字被截斷。 */
        .warn-list {
            display: none; text-align: left; background: #fff8ec;
            border: 1px solid #ffd9a8; border-radius: 10px;
            padding: 10px 12px; margin-bottom: 16px;
        }
        .warn-list.active { display: block; }
        .warn-list-title { font-size: 12px; font-weight: 600; color: #8a5200; margin-bottom: 4px; }
        /* 捲動的是 ul 而不是整個 .warn-list：標題留在捲動範圍外才不會被捲走，
           項目多到需要捲動時使用者仍看得到「這些是沒清乾淨的項目」這個前提。 */
        .warn-list ul { margin: 0; padding: 0 0 0 16px; max-height: 92px; overflow-y: auto; }
        .warn-list li { font-size: 12px; color: #7a4a00; line-height: 1.55; overflow-wrap: anywhere; }

        .nice-btn:hover { background: #0077ED; }
        .nice-btn.secondary { background: #e5e5ea; color: #1d1d1f; }
        .nice-btn.secondary:hover { background: #d8d8dd; }
        /* 「略過偵測，強制繼續」這類最後手段選項：視覺份量刻意比 .secondary
           更輕，不跟主要按鈕搶注意力，避免使用者養成習慣每次都跳過偵測 */
        .nice-btn.tertiary {
            background: transparent; color: #86868b; padding: 8px 12px;
            font-size: 12px; text-decoration: underline; text-underline-offset: 2px;
        }
        .nice-btn.tertiary:hover { color: #1d1d1f; background: transparent; }

        /* 真實抓到的 bug：text-align:center 只會置中行內內容，這個固定寬度
           260px 的區塊本身是 block 元素，沒有 margin:auto 就會貼著父層內容
           區的左邊，導致進度條頁面看起來歪一邊——跟 index.html 用 flex
           column + align-items:center 置中不同，這裡簡單用 margin:auto 修。 */
        /* 拖曳確認畫面：把 App 圖示拖到垃圾桶上放開＝跟按「刪除」按鈕同一件事
           （比照 macOS 把 App 拖進 Dock 垃圾桶的原生解除安裝手勢）。真實抓到
           的問題：這裡原本自己另外發明了一套縮小版的版面尺寸（64px 圖示、
           480x380 視窗），跟 Setup.exe 主安裝畫面（index.html 的
           .workspace/.icon-box/.icon-wrapper/.arrow-box，600x420 視窗）
           擠在一起看起來像兩套不同標準的介面。改成直接沿用 index.html 那組
           class 名稱與尺寸數字（見規格文件 §8.29），不要為解除安裝助手另外
           發明一套。 */

        /* 真實抓到的問題（規格文件 §8.29 記錄的既有慣例）：圖示區塊要當成
           獨立一組置中，文字是另外一組、掛在圖示區塊下方，兩者不能被當成
           同一包內容一起參與置中計算——不然文字的高度會把圖示的視覺中心
           往上推，圖示因此不是真正置中（index.html 當初把「建立桌面捷徑」
           勾選項獨立成 .bottom-bar、不參與 main-view 置中，就是同一個道理）。
           #confirmView 因此不用 .nice-view 預設的「整包置中」，改成自己
           撐滿整個視窗，.workspace 用 position:absolute 精確置中在視窗正
           中央，.confirm-text 是另一個獨立定位的區塊，掛在 .workspace
           下方固定距離，不影響 .workspace 的置中結果。 */
        #confirmView {
            position: fixed; inset: 0; width: 100%; max-width: none; padding: 0;
            max-height: none; overflow: visible;
        }
        /* 真實抓到的問題（/apple-design 橫向比對安裝檔實測發現）：把圖示區塊
           精確置中在視窗正中央（top:50%）看起來反而不平衡——圖示視覺上比較
           「重」，下面又掛著一樣有重量的文字，兩者加起來的視覺重心自然落在
           偏下的位置，於是視窗上半段變成一大片空白，下半段被圖示+文字塞滿，
           兩邊觀感並不對等。這正是 index.html 檔頭修正紀錄裡同一個問題的
           翻版（那裡的結論是：圖示應該幾乎置中、只微幅偏上，不能真的整個
           往下推），差別是這裡圖示下面掛的文字比 index.html 的單行標籤重
           （標題+訊息兩行），所以往上偏移的幅度也要比 index.html 的
           margin-top:8px（約 2% 視窗高度）更明顯一點，改成整組往上偏移到
           約 44% 視窗高度，讓視窗上下的留白視覺上更接近對等。 */
        .workspace {
            display: flex; align-items: center; justify-content: center; gap: 20px;
            position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%);
            margin: 0;
        }
        .confirm-text {
            position: absolute; left: 0; right: 0; top: calc(44% + 68px);
            padding: 0 32px; text-align: center;
        }
        .icon-box { display: flex; flex-direction: column; align-items: center; width: 160px; text-align: center; }
        /* 真實抓到的問題：App 圖示跟垃圾桶圖示先前差太多（90px vs 120px），
           垃圾桶看起來過大；兩邊各自微調一點（App 圖示加大、垃圾桶縮小）
           後視覺份量比較接近。這裡刻意跟 index.html 的 90px 不一樣，是
           confirmView 專屬的例外（見規格文件 §8.29）。 */
        .icon-wrapper {
            width: 100px; height: 100px; display: flex; justify-content: center; align-items: center;
            cursor: grab;
        }
        .icon-wrapper img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

        /* 拖曳解除安裝（自繪 + 彈簧）。跟安裝端共用 ui/drag_to_target.js，
           這裡是那套手勢需要的版面結構——尺寸沿用 confirmView 專屬的 100px
           （見上面的說明，跟 index.html 的 90px 不同是既有的例外）。

           原本這裡是 `.icon-wrapper:active { transform: scale(0.95) }`，
           搭配瀏覽器內建拖放。改成自繪之後那條規則必須拿掉：位移由 JS 每幀
           寫進同一個 transform，CSS 再插手就是兩個主人在搶。按下的回饋改由
           .drag-inner 的放大負責（跟安裝端同一套）。 */
        .icon-slot { position: relative; width: 100px; height: 100px; }
        .icon-slot .icon-wrapper { position: absolute; top: 0; left: 0; }
        #dragAppIcon { z-index: 5; transition: none; touch-action: none; will-change: transform; }
        #dragAppIcon.grabbing { cursor: grabbing; }
        .drag-inner {
            width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
            will-change: transform; transform-origin: center;
            transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1), filter 160ms cubic-bezier(0.23, 1, 0.32, 1);
        }
        /* 原位殘影做成剪影：只留形狀，顏色與細節全部拿掉，讓它明確是個
           「這裡原本有東西」的標記，而不是第二個看起來可以拖的圖示 */
        #dragGhost { z-index: 1; opacity: 0; pointer-events: none; filter: brightness(0) saturate(0); }
        #dragGhost.shown { opacity: 0.16; }
        /* 真實抓到的無障礙問題：這顆要拖到垃圾桶上才會觸發解除安裝的圖示，
           是整個解除安裝流程唯一的觸發點（依 ADR-0002 決定四，不另外提供
           「跳過拖曳」按鈕），但它原本沒有 tabindex、沒有 role、也沒有任何
           鍵盤事件——**整個解除安裝介面完全無法用鍵盤操作**。安裝端早就
           解決過這件事，這裡比照補上，焦點框跟 .nice-btn 同一套視覺。 */
        #dragAppIcon:focus-visible { outline: 2px solid #0071e3; outline-offset: 2px; }
        /* 系統要求減少動態效果時，只收掉「介面自己在動」的部分；使用者拖著
           圖示走的位移是直接操作，關掉反而會讓人不知道自己拖到哪裡 */
        @media (prefers-reduced-motion: reduce) {
            .drag-inner { transition: none; }
        }
        .arrow-box { height: 90px; display: flex; align-items: center; }
        .arrow-svg { width: 28px; height: 28px; }
        /* 垃圾桶本身：桶身＋蓋子兩張圖疊在同一個相對定位容器內，維持素材原始
           1024x1024 畫布的相對座標關係（不個別置中），疊起來才會還原成完整的
           垃圾桶圖案。真實抓到的問題：一開始跟左邊 App 圖示（.icon-wrapper）
           做一樣的 90x90，垃圾桶本身圖案線條較粗、留白較少，同樣尺寸視覺
           份量比圖示輕，改成 120x120 又太大；最後兩邊各自微調（App 圖示
           100x100、垃圾桶 110x110）比較接近平衡。 */
        /* 真實抓到的 bug：拖曳應用程式圖示到垃圾桶時常常「愛理不理」，圖示
           明明已經在垃圾桶範圍內卻沒觸發開蓋動畫——原因是 .trash-can 這個
           div 是 #trashDropTarget 底下的子元素，滑鼠/拖曳游標從
           #trashDropTarget 的內距移到 .trash-can 本身時，等於跨越了一個
           DOM 元素邊界，瀏覽器原生 HTML5 拖放會因此多觸發一組
           dragleave/dragenter，造成狀態忽開忽關。加上 pointer-events:none
           讓 .trash-can（以及裡面的圖片，已經是 none）完全不接收拖放事件，
           事件只會落在 #trashDropTarget 本身，不會再有子元素邊界造成的
           忽閃忽滅。 */
        .trash-can { position: relative; width: 110px; height: 110px; transition: filter 0.2s; pointer-events: none; }
        .trash-can img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        .trash-lid {
            /* 真實抓到的問題：支點原本抓在左側，蓋子往右掀時支點應該在右側
               （鉸鏈靠近桶身右後方），這樣打開時蓋子下緣才會一直貼著桶身，
               不會整片浮起來。角度由 JS 的彈簧動畫驅動，不用 CSS
               transition——見下方 createAngleSpring()，這樣才能在使用者快速
               拖進拖出時，從目前角度與速度接續動畫，不會卡頓或跳幀。 */
            transform-origin: 82% 82%;
        }
        #trashDropTarget.drag-over .trash-can {
            /* 真實抓到的問題：放大效果（先前 1.06 倍、後來收斂到 1.02 倍）
               疊加蓋子旋轉，兩個效果加在一起看起來很怪——尤其縮到 1.02 倍
               這種幾乎看不出來的放大反而顯得不上不下。拿掉縮放，只靠蓋子
               旋轉本身＋陰影當作回饋，動作更單純乾脆。
               陰影原本帶紅色（rgba(255,59,48,...)），語意上紅色是警示/危險色，
               但這裡蓋子彈開動畫本身已經完整傳達狀態改變了，紅色暈影是多餘
               且錯置的訊號，改成中性（無彩色）。
               真實抓到的問題：一開始只疊了單一層 drop-shadow（大 blur、
               中等透明度），結果整片暈開的濃淡很平均，不像真實陰影——真實
               陰影是貼著物體的地方最深，往外擴散幾乎立刻就變淡。改成疊兩層
               drop-shadow：一層 blur 小、透明度高（貼合物體邊緣的「接觸
               陰影」），另一層 blur 大、透明度低（外圍模糊的「環境陰影」），
               兩層疊起來才有真實陰影那種「近深遠淺」的漸層感，而不是均勻
               一片。 */
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.4)) drop-shadow(0 6px 12px rgba(0, 0, 0, 0.12));
        }

        /* 真實抓到的問題：#progressView 裡標題(margin-bottom:6px)、進度條、
           復原按鈕(原本 margin-top:16px)彼此間距不一致，忽緊忽鬆看起來
           隨意、沒設計過。統一改成一致的 20px 節奏，讓三者感覺是同一組、
           有規律地分佈，而不是擠成一團。
           另外原本試過在標題上方加一顆會轉的 spinner icon 撐視覺重量，
           但畫面下面已經有一條明確顯示百分比的進度條，兩者一起出現語意
           會打架（spinner 通常代表「不確定要多久」，跟底下明確進度矛盾），
           使用者實測後回報很怪，已經拿掉。也試過只加寬加粗進度條本身，
           使用者實測後仍覺得不平衡：標題文字（4 個字）比下面按鈕文字
           （2 個字）視覺重，光靠進度條加寬加粗不足以抵銷，整體還是偏上。
           改成維持標題原本位置不動，把進度條＋按鈕這組往下方多推一點
           （在 install-progress-wrap 上加 margin-top），加大標題跟下面
           內容的距離，讓視覺重心不要那麼靠近標題。使用者接著回報標題
           本身也要再往下一點點，補上小幅 margin-top。 */
        #progressView .nice-title { margin-top: 48px; margin-bottom: 20px; }
        .install-progress-wrap { width: 320px; margin: 40px auto 0 auto; }
        .install-progress-text { font-size: 11px; color: #86868b; text-align: center; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .install-progress-track { width: 100%; height: 6px; background: #e5e5ea; border-radius: 3px; overflow: hidden; }
        .install-progress-fill { width: 0%; height: 100%; background: #0071e3; transition: width 0.2s ease; }
        /* 反悔倒數期間的「復原」按鈕，只在倒數的前 4 秒顯示；倒數結束
           （或使用者按下）之後就會被隱藏，不佔用版面。 */
        .undo-btn { margin-top: 20px; }
    </style>
</head>
<body>

    <div class="drag-region" id="dragRegion"></div>

    <div class="custom-close-btn" onclick="onCancel();" title="關閉" data-i18n-title="close_title">
        <div class="css-close-icon"></div>
    </div>

    <div class="nice-view" id="confirmView">
        <div class="workspace">
            <div class="icon-box">
                <div class="icon-slot">
                    <!-- 原位殘影：拖曳本體被拿起後留在原地的替身，同時是沒有
                         命中時彈回去的目的地 -->
                    <div class="icon-wrapper" id="dragGhost" aria-hidden="true">
                        <img src="app_icon.png" alt="">
                    </div>
                    <div class="icon-wrapper" id="dragAppIcon" tabindex="0" role="button"
                         onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); triggerUninstallFromDragItem(); }">
                        <div class="drag-inner"><img src="app_icon.png" alt="App"></div>
                    </div>
                </div>
            </div>
            <div class="arrow-box">
                <svg class="arrow-svg" viewBox="0 0 24 24">
                    <path d="M5 12h14M12 5l7 7-7 7" stroke="#a1a1a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>
            </div>
            <div class="icon-box" id="trashDropTarget">
                <div class="trash-can">
                    <img class="trash-body" src="trash_body.svg" alt="">
                    <img class="trash-lid" id="trashLid" src="trash_lid.svg" alt="">
                </div>
            </div>
        </div>
        <div class="confirm-text">
            <div class="nice-title" id="confirmTitle" data-i18n="confirm_title">解除安裝助手</div>
            <div class="nice-message" id="confirmMessage" style="text-align:center;"></div>
        </div>
    </div>

    <div class="nice-view" id="lockingProcessesView">
        <div class="nice-icon warn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L14.7 3.86a2 2 0 0 0-3.4 0z"></path></svg></div>
        <div class="nice-title" data-i18n="locking_title">偵測到程式鎖定檔案</div>
        <div class="nice-message" id="lockingMessage" style="text-align:left;"></div>
        <button class="nice-btn secondary" onclick="onLockingProceed(false)" data-i18n="btn_no">否</button>
        <button class="nice-btn" onclick="onLockingProceed(true)" data-i18n="btn_yes">是</button>
    </div>

    <div class="nice-view" id="processRunningView">
        <div class="nice-icon error"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>
        <div class="nice-title" id="processRunningTitle" data-i18n="process_running_title">程式正在執行</div>
        <div class="nice-message" id="processRunningMessage" style="text-align:center;"></div>
        <button class="nice-btn secondary" onclick="onCancel()" data-i18n="btn_ok">了解</button>
        <button class="nice-btn" onclick="closeRunningAppAndRetry()" data-i18n="btn_close_and_continue">關閉應用程式並繼續解除安裝</button>
        <div><button class="nice-btn tertiary" onclick="forceContinueUninstall()" data-i18n="btn_force_continue">關閉沒有用？略過偵測，強制繼續解除安裝</button></div>
    </div>

    <div class="nice-view" id="progressView">
        <div class="nice-title" data-i18n="progress_title">正在解除安裝...</div>
        <div class="install-progress-wrap">
            <div class="install-progress-text" id="progressText"></div>
            <div class="install-progress-track"><div class="install-progress-fill" id="progressFill"></div></div>
        </div>
        <!-- 反悔倒數期間顯示的「復原」按鈕：放開滑鼠後不是馬上真的刪除，
             而是先跑一段 4 秒的反悔倒數（進度條 0-25%），這段期間按這顆按鈕
             可以取消，回到 confirmView 重新拖曳；倒數結束後這顆按鈕會被
             隱藏並停用，才真正呼叫 run_uninstall()。 -->
        <button class="nice-btn secondary undo-btn" id="undoBtn" onclick="onUndoDelete()" data-i18n="btn_undo" style="display:none;">復原</button>
    </div>

    <div class="nice-view" id="doneView">
        <div class="nice-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
        <div class="nice-title" data-i18n="done_title">解除安裝完成</div>
        <div class="nice-message" id="doneMessage" style="text-align:center;"></div>
        <div class="warn-list" id="uninstallWarnings">
            <div class="warn-list-title" data-i18n="uninstall_warnings_title">下列項目沒有清除乾淨：</div>
            <ul id="uninstallWarningItems"></ul>
        </div>
        <button class="nice-btn" onclick="onFinish()" data-i18n="btn_done">完成</button>
    </div>

    <div class="nice-view" id="errorView">
        <div class="nice-icon error"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>
        <div class="nice-title" data-i18n="error_title">解除安裝失敗</div>
        <div class="nice-message" id="errorMessage" style="text-align:center;"></div>
        <button class="nice-btn" onclick="onCancel()" data-i18n="btn_ok">了解</button>
    </div>

    <!-- 彈簧求解器，拖曳位移與垃圾桶蓋角度共用（見該檔案的說明）。必須排在
         drag_to_target.js 之前：那份檔案會呼叫 createSpring()。 -->
    <script src="spring.js"></script>
    <!-- 拖曳手勢的實作，跟安裝端共用同一份（見 ADR-0002 與該檔案的說明）。
         必須排在下面那段之前：createDragToTarget() 在那裡就會被呼叫。 -->
    <script src="drag_to_target.js"></script>
    <!-- 介面翻譯，三份畫面共用同一份（見該檔案的說明）。必須排在下面那段
         之前：createI18n() 在那裡就會被呼叫。 -->
    <script src="i18n.js"></script>
    <script>
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        const I18N = {
            "zh-TW": {
                close_title: "關閉",
                confirm_title: "解除安裝助手",
                confirm_message: "拖動圖標以解除安裝「{{name}}」",
                locking_title: "偵測到程式鎖定檔案",
                locking_message: "偵測到「{{name}}」的部分檔案目前被下列程式鎖定：{{processes}}。\n需要先結束這些程式才能完整移除相關檔案，是否繼續？\n\n（選「否」解除安裝仍會繼續，但可能有檔案因為還在使用中而無法刪除。）",
                btn_no: "否",
                btn_yes: "是",
                process_running_title: "程式正在執行",
                process_running_message: "「{{name}}」目前正在執行中。\n請先關閉程式後再解除安裝。",
                btn_ok: "了解",
                btn_close_and_continue: "關閉應用程式並繼續解除安裝",
                btn_force_continue: "關閉沒有用？略過偵測，強制繼續解除安裝",
                progress_title: "正在解除安裝...",
                btn_undo: "復原",
                done_title: "解除安裝完成",
                done_message: "「{{name}}」已成功移除。",
                done_message_with_warnings: "「{{name}}」已移除，但有部分項目沒有清除乾淨。",
                uninstall_warnings_title: "下列項目沒有清除乾淨：",
                btn_done: "完成",
                error_title: "解除安裝失敗",
                step_registry: "正在清理 Windows 註冊表...",
                step_shortcuts: "正在移除捷徑...",
                step_file_assoc: "正在移除檔案關聯...",
                step_path: "正在從環境變數 PATH 移除安裝路徑...",
                step_files: "正在刪除安裝目錄下的檔案...",
            },
            "en": {
                close_title: "Close",
                confirm_title: "Uninstaller",
                confirm_message: "Drag the icon to uninstall \"{{name}}\"",
                locking_title: "Files are locked by other programs",
                locking_message: "Some files belonging to \"{{name}}\" are currently locked by: {{processes}}.\nThese programs need to be closed first to fully remove the related files. Continue?\n\n(Choosing \"No\" still continues the uninstall, but some in-use files may fail to be removed.)",
                btn_no: "No",
                btn_yes: "Yes",
                process_running_title: "Application is running",
                process_running_message: "\"{{name}}\" is currently running.\nPlease close it before uninstalling.",
                btn_ok: "OK",
                btn_close_and_continue: "Close it and continue uninstalling",
                btn_force_continue: "Closing didn't help? Skip detection and continue anyway",
                progress_title: "Uninstalling...",
                btn_undo: "Undo",
                done_title: "Uninstall Complete",
                done_message: "\"{{name}}\" has been removed successfully.",
                done_message_with_warnings: "\"{{name}}\" was removed, but some items could not be cleaned up.",
                uninstall_warnings_title: "The following items were not cleaned up:",
                btn_done: "Done",
                error_title: "Uninstall Failed",
                step_registry: "Cleaning up the Windows registry...",
                step_shortcuts: "Removing shortcuts...",
                step_file_assoc: "Removing file associations...",
                step_path: "Removing the install path from PATH...",
                step_files: "Deleting installed files...",
            },
        };
        let currentLang = "zh-TW";
        // 翻譯機制收在 ui/i18n.js，三份畫面共用（見該檔案的說明）。
        const i18n = createI18n(I18N, "zh-TW");
        function t(key, vars) { return i18n.t(key, vars); }
        function applyI18n(lang) {
            currentLang = i18n.apply(lang);
        }

        // 自訂視窗拖曳，寫法跟 index.html 完全一致（見該檔案的說明）
        (function setupCustomDrag() {
            const dragRegion = document.getElementById('dragRegion');
            let isDragging = false;
            let pendingPos = null;
            function dragLoop() {
                if (!isDragging) return;
                if (pendingPos) { pywebview.api.drag_move(pendingPos[0], pendingPos[1]); pendingPos = null; }
                requestAnimationFrame(dragLoop);
            }
            dragRegion.addEventListener('mousedown', (e) => {
                isDragging = true;
                pywebview.api.start_drag(e.screenX, e.screenY);
                requestAnimationFrame(dragLoop);
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                if ((e.buttons & 1) === 0) { isDragging = false; pendingPos = null; pywebview.api.end_drag(); return; }
                pendingPos = [e.screenX, e.screenY];
            });
            document.addEventListener('mouseup', () => {
                if (isDragging) { isDragging = false; pendingPos = null; pywebview.api.end_drag(); }
            });
        })();

        /* 輕量彈簧動畫（不依賴外部函式庫，這是離線的本機頁面，不能掛 CDN）：
           驅動垃圾桶蓋子的旋轉角度。跟 /apple-design 的 damping/response
           參數化方式一致，而不是用固定時長的 CSS transition/keyframes——
           這樣使用者快速把 App 圖示拖進拖出垃圾桶時，動畫會從目前的角度與
           速度接續，不會卡頓、也不會在方向反轉時瞬間跳幀。 */
        function createAngleSpring(el, opts) {
            const { closedAngle = 0, openAngle = 9, openDamping = 0.85, closeDamping = 1.0, response = 0.35 } = opts || {};
            // 求解器收在 ui/spring.js，跟拖曳的位移動畫共用同一份（原本這裡
            // 自己寫了一份，而且少了固定子步長積分——掉幀時角度會發散，
            // 見該檔案的說明）。開闔用不同的阻尼：掀開時允許一點過衝比較
            //有彈開的感覺，闔上時不過衝才像蓋子真的蓋回去。
            const sp = createSpring({ response: response, damping: closeDamping, value: closedAngle });
            let rafId = null;
            let lastTime = null;

            function step(now) {
                if (lastTime === null) lastTime = now;
                const dt = Math.min((now - lastTime) / 1000, 1 / 30);
                lastTime = now;
                sp.step(dt);
                el.style.transform = `rotate(${sp.x}deg)`;
                if (!sp.atRest()) {
                    rafId = requestAnimationFrame(step);
                } else {
                    sp.settle();
                    el.style.transform = `rotate(${sp.x}deg)`;
                    rafId = null;
                    lastTime = null;
                }
            }

            function setOpen(open) {
                sp.target = open ? openAngle : closedAngle;
                sp.damping = open ? openDamping : closeDamping;
                if (rafId === null) { lastTime = null; rafId = requestAnimationFrame(step); }
            }

            return { setOpen };
        }

        const trashLidSpring = createAngleSpring(document.getElementById('trashLid'));

        // 拖曳 App 圖示到垃圾桶：跟 index.html 的拖放邏輯（HTML5 原生
        // dragstart/dragover/drop）同一套寫法，這是 confirmView 唯一的操作
        // 方式（真實抓到的問題：原本下面還留了「取消」「刪除」兩個按鈕，
        // 但拖曳本身就是解除安裝的觸發動作，兩套機制同時存在只是佔位置又
        // 令人困惑；主安裝畫面也只有拖曳沒有額外按鈕，這裡改成一致——
        // 取消／關閉沿用左上角既有的 X 關閉鈕即可，不用另外重複一份）。
        // 放開在垃圾桶範圍內＝呼叫 onDelete()；拖出範圍或沒有放上去＝蓋子
        // 彈簧自然收回，不做任何刪除動作。
        // ---------------- 拖曳解除安裝（自繪 + 彈簧）----------------
        // 手勢本體收在 ui/drag_to_target.js，跟安裝端共用同一套。
        //
        // 這裡原本用的是瀏覽器內建的 HTML5 拖放（draggable="true" +
        // dragstart／dragenter／dragleave／drop）——也就是安裝端在 ADR-0002
        // 已經換掉的那套機制。ADR-0002 的理由對這裡一字不改地成立：拖曳時
        // 跟著游標移動的那張影像由作業系統繪製，網頁端無法控制它的外觀、
        // 縮放、透明度，也無法在放開時介入，所以做不到按下的即時回饋、
        // 沒命中的彈回、命中的吸入——而拖曳解除安裝跟拖曳安裝是同一個核心
        // 識別動作的兩端，不該只有一邊有這些。
        //
        // 附帶收穫：舊實作的圖示沒有 tabindex／role／鍵盤事件，整個解除
        // 安裝介面完全無法用鍵盤操作。共用之後跟安裝端一樣可以用鍵盤。
        //
        // 兩端真正不同的只有目的地的回應：安裝端是資料夾「吞一下」，這裡是
        // 垃圾桶掀蓋／闔蓋，用 onHoverChange／onAbsorb 參數化。
        const uninstallDragItem = document.getElementById('dragAppIcon');
        const trashDropTarget = document.getElementById('trashDropTarget');

        // 解除安裝狀態，理由同安裝端（見 ui/index.html 的 installState）：
        // 進行中或已完成都不該再被拖一次。這裡的畫面切換（showView）雖然會
        // 把整個 confirmView 藏起來，但那是副作用不是設計——已經取得指標
        // 捕獲的拖曳不經過命中測試，不能只靠畫面被藏起來擋。
        let uninstallState = 'idle';

        const uninstallDragController = createDragToTarget({
            item: uninstallDragItem,
            inner: uninstallDragItem.querySelector('.drag-inner'),
            ghost: document.getElementById('dragGhost'),
            target: trashDropTarget,
            targetSlot: trashDropTarget.querySelector('.trash-can'),
            canDrag: () => uninstallState === 'idle',
            onHoverChange: (on) => { trashLidSpring.setOpen(on); },
            onAbsorb: () => {
                // 圖示被吸進垃圾桶的同時把蓋子闔上——東西進去了，蓋子就該蓋回
                // 去。蓋子的角度本來就由彈簧驅動（見 createAngleSpring()），
                // 這裡只要把目標角度切回關閉，它會從目前角度與速度接續過去。
                trashLidSpring.setOpen(false);
            },
            onHit: () => { triggerUninstallFromDragItem(); },
        });

        // 滑鼠拖曳與鍵盤（Enter／空白鍵）走同一個函式，兩邊行為不會分岔。
        function triggerUninstallFromDragItem() {
            if (uninstallState !== 'idle') return;
            onDelete();
        }

        let appName = "";

        function showView(id) {
            // 切走畫面時終結進行中的拖曳。把 confirmView 藏起來確實會讓
            // 圖示消失，但那擋不住已經取得指標捕獲的拖曳——捕獲中的指標
            // 事件完全不經過命中測試。不主動終結的話，使用者手上會留著一個
            // 看不見卻還活著的拖曳，切回來時圖示卡在半空中。
            if (typeof uninstallDragController !== 'undefined') {
                uninstallDragController.cancel();
            }
            document.querySelectorAll('.nice-view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function onCancel() { pywebview.api.cancel(); }

        async function closeRunningAppAndRetry() {
            await pywebview.api.close_running_main_exe();
            onDelete();
        }

        // 保底選項：極少數情況下偵測會卡死（例如目標程式在系統層級留下
        // Windows 工作管理員都看不到、但行程表裡還存在的殭屍行程，
        // taskkill 對這種情況也沒用，只有重開機才會恢復正常）——這種情境
        // 讓使用者一直被卡在「關閉程式並繼續」也沒用的迴圈裡沒有意義，
        // 提供一個明確跳過偵測、強制繼續的出口。
        function forceContinueUninstall() {
            onDelete(true);
        }

        async function onDelete(forceSkipProcessCheck) {
            if (!forceSkipProcessCheck) {
                const running = await pywebview.api.check_main_exe_running();
                if (running) {
                    document.getElementById('processRunningMessage').innerText = t('process_running_message', { name: appName });
                    showView('processRunningView');
                    return;
                }
            }
            const processes = await pywebview.api.get_locking_process_names();
            if (processes && processes.length > 0) {
                document.getElementById('lockingMessage').innerText = t('locking_message', { name: appName, processes: processes.join('、') });
                showView('lockingProcessesView');
                return;
            }
            // 從這裡開始不再是「還可以改變主意」的狀態，圖示不該再被拖
            // 一次。反悔倒數期間也算——那段時間畫面已經切到 progressView，
            // 但狀態要一致，才不會靠「圖示剛好看不到」這種副作用擋。
            uninstallState = 'running';
            startUninstallWithGrace();
        }

        // 鎖定中程序／主程式執行中這兩個分支，使用者已經在額外畫面上做過一次
        // 明確選擇（onLockingProceed），不需要再疊加一次反悔倒數，維持原本
        // 「立即開始、無反悔期」的行為。
        function onLockingProceed(kill) { startUninstall(kill); }

        // 拖曳放開後（沒有鎖定/佔用問題那個分支）走的是反悔倒數流程：真正的
        // run_uninstall() 回報的 0-100 進度，需要映射到 25-100 這個尾段，
        // 前 0-25 是純前端倒數動畫，這個旗標決定 updateUninstallProgress
        // 是否要做映射。
        let remapProgressToTail = false;

        window.updateUninstallProgress = function (percent, message) {
            document.getElementById('progressText').innerText = message;
            const visualPercent = remapProgressToTail ? (25 + percent * 0.75) : percent;
            document.getElementById('progressFill').style.width = visualPercent + '%';
        };

        // F01：後端 run_uninstall() 的成功結果一直帶著 warnings（六個移除
        // 步驟各自的失敗、加上刪不掉的檔案），但兩個呼叫點原本都只判斷
        // status 就切到完成畫面，這份清單從來沒有被讀取——uninstall.py 收集
        // 它的理由正是「讓使用者不會在 PATH／捷徑／登錄表項目全部沒清乾淨
        // 的情況下，還是看到一個解除安裝完成的畫面」，沒有出口等於那個理由
        // 並未成立。兩個呼叫點共用這一個函式，不各自複製一份判斷。
        //
        // 用 textContent 而不是 innerHTML 填內容：警告字串裡含檔案路徑、
        // 服務名稱、例外訊息，不該被當成 HTML 解析。
        function showUninstallDone(result) {
            uninstallState = 'done';
            const warnings = result.warnings || [];
            document.getElementById('doneMessage').innerText = warnings.length
                ? t('done_message_with_warnings', { name: appName })
                : t('done_message', { name: appName });

            const box = document.getElementById('uninstallWarnings');
            const list = document.getElementById('uninstallWarningItems');
            list.innerHTML = '';
            warnings.forEach((w) => {
                const li = document.createElement('li');
                li.textContent = w;
                list.appendChild(li);
            });
            box.classList.toggle('active', warnings.length > 0);

            showView('doneView');
        }

        async function startUninstall(killLockingProcesses) {
            showView('progressView');
            const result = await pywebview.api.run_uninstall(killLockingProcesses);
            if (result.status === 'success') {
                showUninstallDone(result);
            } else {
                document.getElementById('errorMessage').innerText = result.message || '';
                showView('errorView');
            }
        }

        // --- 反悔倒數（拖曳放開後的預設路徑）---
        // 真實抓到的設計取捨：使用者放開滑鼠後如果馬上真的開始刪除，中間沒有
        // 任何反悔機會；但額外跳一個確認彈窗又容易被盲目點過去、也跟「只留
        // 拖曳手勢、拿掉取消/刪除按鈕」的簡化方向矛盾。改成進度條分兩段：
        // 放開滑鼠後畫面就進到 progressView、進度條開始往前跑，前 1/4（0-25%）
        // 是 4 秒的反悔倒數（可按「復原」取消），倒數結束才真正呼叫
        // run_uninstall()，其回報的真實進度映射到剩下的 25-100，同一條進度條
        // 無縫接續，不會有倒退或跳動感。
        //
        // 倒數動畫刻意不是勻速：參考 ui/config.html 的 progressTick 已經用過的
        // 「跟目標差距決定速度、且有最小步進下限」曲線（差距越大追得越快，
        // 越接近目標越慢，但下限保證不會真的停住）。這裡另外加上以
        // performance.now() 算的牆鐘時間，確保 4 秒整這個里程碑跟裝置更新率
        // 無關；靠曲線本身很難剛好在 4 秒整精確落在 25%，所以刻意讓曲線在
        // 4 秒時還沒到 25%（仍有下限速度在動），倒數真正結束那一刻才把進度條
        // 校正到精確的 25%，這個極小的收尾誤差不易察覺。
        const GRACE_DURATION_MS = 4000;
        const GRACE_TARGET = 25;
        const GRACE_RATE = 1.0;   // 差距的每秒收斂比例（時間常數約 1 秒）
        const GRACE_FLOOR = 1.0;  // 每秒最小爬升量，避免曲線在尾段看起來停住

        let graceRafId = null;
        let graceTimeoutId = null;
        let graceLastTime = null;
        let graceDisplayed = 0;
        let graceCancelled = false;

        function graceTick(now) {
            if (graceCancelled) return;
            if (graceLastTime === null) graceLastTime = now;
            const dt = Math.min((now - graceLastTime) / 1000, 1 / 30);
            graceLastTime = now;
            const gap = GRACE_TARGET - graceDisplayed;
            const step = Math.max(GRACE_FLOOR * dt, gap * GRACE_RATE * dt);
            graceDisplayed = Math.min(graceDisplayed + step, GRACE_TARGET);
            document.getElementById('progressFill').style.width = graceDisplayed + '%';
            graceRafId = requestAnimationFrame(graceTick);
        }

        async function startUninstallWithGrace() {
            showView('progressView');
            document.getElementById('progressText').innerText = '';
            document.getElementById('progressFill').style.width = '0%';

            graceDisplayed = 0;
            graceCancelled = false;
            graceLastTime = null;
            const undoBtn = document.getElementById('undoBtn');
            undoBtn.style.display = '';
            undoBtn.disabled = false;

            graceRafId = requestAnimationFrame(graceTick);
            graceTimeoutId = setTimeout(async () => {
                if (graceCancelled) return;
                cancelAnimationFrame(graceRafId);
                undoBtn.style.display = 'none';
                document.getElementById('progressFill').style.width = GRACE_TARGET + '%';

                remapProgressToTail = true;
                const result = await pywebview.api.run_uninstall(false);
                remapProgressToTail = false;
                if (result.status === 'success') {
                    showUninstallDone(result);
                } else {
                    document.getElementById('errorMessage').innerText = result.message || '';
                    showView('errorView');
                }
            }, GRACE_DURATION_MS);
        }

        function onUndoDelete() {
            graceCancelled = true;
            if (graceRafId !== null) cancelAnimationFrame(graceRafId);
            if (graceTimeoutId !== null) clearTimeout(graceTimeoutId);
            document.getElementById('undoBtn').style.display = 'none';
            document.getElementById('progressFill').style.width = '0%';
            uninstallState = 'idle';
            showView('confirmView');
        }

        async function onFinish() {
            await pywebview.api.finish_and_exit();
        }

        window.addEventListener('pywebviewready', async () => {
            const uiLanguage = await pywebview.api.get_ui_language();
            applyI18n(uiLanguage);
            appName = await pywebview.api.get_app_name();
            document.getElementById('confirmMessage').innerText = t('confirm_message', { name: appName });
            showView('confirmView');
        });
    </script>
</body>
</html>
