<!--
    index.html — 安裝程式主介面（macOS DMG 風格拖曳安裝）

    修正紀錄：
    - 原本整個檔案沒有任何 pywebview-drag-region class，視窗完全無法拖動。
      後來補上 .drag-region 並套用 pywebview-drag-region，但發現這個內建機制
      拖曳開始瞬間會往左上方跳一下才跟上游標，100% 縮放下也會發生，
      判斷是機制本身的問題。改成完全自己算滑鼠位移量、呼叫 window.move()
      搬動視窗（見下方 setupCustomDrag() 與 installer_core.py 的
      start_drag/drag_move/end_drag），徹底繞開這個問題。
    - 左上角關閉按鈕 z-index 高於拖曳區，仍可正常點擊，不受影響。
    - .workspace 原本用 align-items: center 對齊三欄（app 圖示／箭頭／資料夾圖示），
      但三欄底下的文字行數不一樣（資料夾那欄多一行路徑文字），導致「整欄置中」
      跟「圖示置中」變成兩件事，圖示因此對不齊。改成 align-items: flex-start，
      讓三欄都從同一條頂線起排，圖示天生落在同一條水平線上，不受文字行數影響。
    - 整體內容視覺重心偏上：實測上下留白其實接近相等，但左上角關閉按鈕/拖曳區
      讓上方感覺比較「滿」，下方純空白顯得更空，兩邊觀感不對等。main-view /
      eula-view 一開始加了 margin-top: 32px 把內容往下推，是憑觀感調的數值。
      後來查了 Apple 實際「拖曳圖示安裝」DMG 視窗的慣例座標（例如 600x400 的
      視窗，圖示 Y 座標落在 190，幾乎貼著正中心、只微幅偏上約 2.5%），發現
      圖示应该幾乎置中、甚至比中心略高，跟 32px 往下推的方向並不一致。
      改成 margin-top: 8px，改為有實際案例依據的小幅偏移，不是憑感覺的大調整。
      如果視覺上還是覺得不平衡，這兩個 margin-top 是最直接能再微調的地方。
    - 「建立桌面捷徑」勾選項原本跟圖示放在同一個 main-view 裡，導致整個內容
      （圖示+勾選項）被當成一整包置中，圖示因此天生偏在這一整包的上半部，
      讓人覺得圖示「飄」在上面。現在把它搬出 main-view，改成獨立的 .bottom-bar，
      用 position: fixed; bottom: 20px 釘死在視窗底部（對應 Apple HIG 的
      Bottom Bar 慣例、以及 20pt 底邊界留白），不再參與圖示區塊的置中計算，
      兩者的顯示/隱藏用 setMainViewVisible() 同步（EULA 頁顯示時兩個都要藏）。

    新增紀錄（安裝精靈標準流程補齊）：
    - EULA 頁：pywebview.api.get_eula_text() 若回傳非空字串，安裝前先顯示同意頁面。
    - 覆蓋安裝偵測：頁面載入時呼叫 check_existing_install()，依 is_newer/is_same/
      is_older 三態分別顯示藍色更新／原本樣式／收斂過的警示紅三種提示。這裡
      按下確認鈕只代表使用者同意，真正靜默呼叫舊版本 uninstall.exe 的動作
      延後到使用者拖曳圖示、觸發 trigger_installation() 之後才由後端執行
      （見 installer_core.py 的 run_upgrade_uninstall() 呼叫時機），避免使用者
      按完確認鈕、還沒拖曳圖示就反悔關視窗，舊版本卻已經被刪掉。
    - 相依元件警告：呼叫 get_dependency_warnings()，非阻擋式提示缺少的執行環境。
    - 真實進度條：安裝過程由後端呼叫 window.updateInstallProgress(percent, message)
      即時更新，不再是死文字。
    - 桌面捷徑小勾選：畫面下方新增一個不搶視覺的勾選框，值會傳給
      trigger_installation(create_desktop_shortcut)。
    - 安裝完成彈窗新增「立即執行程式」勾選，完成按鈕會依勾選狀態呼叫 launch_app()。

    安裝密碼保護（見 CONTEXT.md「安裝密碼保護」一節）：
    - 密碼關卡是 EULA 之前的另一道前置關卡，比照 eula-view 同一種「先過
      這關才能繼續」的模式：is_password_protected() 回傳 true 時，
      pywebviewready 一開始先顯示 passwordView，通過驗證（呼叫
      verify_install_password()）才會依序看到 EULA、主拖曳畫面；沒有
      密碼保護的安裝檔完全跳過這一段，行為不變。
    - 密碼錯誤不限制重試次數（定位是存取控制，不是防暴力破解），只在
      畫面上顯示錯誤訊息，讓使用者可以直接重新輸入再試一次。
-->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>DMG Installer</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; background-color: #f5f5f7;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }
        /* 頂部一整條透明拖曳區，讓使用者可以按住空白處移動視窗 */
        .drag-region {
            position: fixed; top: 0; left: 0; width: 100%; height: 40px;
            z-index: 9998;
        }
        .custom-close-btn {
            position: fixed; top: 16px; left: 16px; width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border-radius: 50%; background-color: transparent; color: #8e8e93;
            transition: background-color 0.2s, color 0.2s; z-index: 9999;
        }
        .custom-close-btn:hover { background-color: rgba(0, 0, 0, 0.06); color: #1d1d1f; }
        /* 真實抓到的無障礙問題：這個關閉鈕原本是 <div onclick>，div 預設
           不在 Tab 鍵操作順序裡，鍵盤使用者完全按不到。補上 tabindex/
           role="button" 讓它進入 Tab 順序、可以被螢幕報讀器辨識成按鈕，
           這裡另外補上鍵盤焦點框（跟 .nice-btn 用同一套視覺）。 */
        .custom-close-btn:focus-visible { outline: 2px solid #0071e3; outline-offset: 2px; background-color: rgba(0, 0, 0, 0.06); color: #1d1d1f; }
        .css-close-icon { position: relative; width: 10px; height: 10px; }
        .css-close-icon::before, .css-close-icon::after {
            content: ''; position: absolute; top: 50%; left: 0; width: 10px; height: 1.5px;
            background-color: currentColor; border-radius: 1px;
        }
        .css-close-icon::before { transform: translateY(-50%) rotate(45deg); }
        .css-close-icon::after { transform: translateY(-50%) rotate(-45deg); }

        .main-view { display: flex; flex-direction: column; align-items: center; margin-top: 8px; }

        .workspace { display: flex; align-items: flex-start; justify-content: space-between; width: 420px; margin-bottom: 8px; }
        .icon-box { display: flex; flex-direction: column; align-items: center; width: 160px; text-align: center; }
        .icon-wrapper { width: 90px; height: 90px; display: flex; justify-content: center; align-items: center; cursor: grab; transition: transform 0.2s; }
        .icon-wrapper img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        /* 拖曳本體與原位殘影疊在同一個位置上，所以外面包一層固定尺寸的槽 */
        .icon-slot { position: relative; width: 90px; height: 90px; }
        .icon-slot .icon-wrapper { position: absolute; top: 0; left: 0; }
        /* 位移由 JS 每幀寫進 #drag-item 的 transform，不能再有 CSS transition
           在同一個屬性上拉扯；縮放與影子則分到內層的 .drag-inner，兩者互不
           覆蓋（同一個 transform 只能有一個主人） */
        #drag-item { z-index: 5; transition: none; touch-action: none; will-change: transform; }
        #drag-item.grabbing { cursor: grabbing; }
        .drag-inner {
            width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
            will-change: transform; transform-origin: center;
            transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1), filter 160ms cubic-bezier(0.23, 1, 0.32, 1);
        }
        /* 原位殘影做成剪影：只留形狀，顏色與細節全部拿掉，讓它明確是個
           「這裡原本有東西」的標記，而不是第二個看起來可以拖的圖示 */
        #dragGhost { z-index: 1; opacity: 0; pointer-events: none; filter: brightness(0) saturate(0); }
        #dragGhost.shown { opacity: 0.16; }
        /* 真實抓到的無障礙問題：這顆要拖去資料夾上才會觸發安裝的圖示，
           是整個安裝流程唯一的觸發點，原本只掛滑鼠拖曳事件，Tab 鍵完全
           選不到它。補上 tabindex/role="button" 讓它進入 Tab 順序並被
           螢幕報讀器辨識成按鈕，這裡補上鍵盤焦點框（跟 .nice-btn /
           .custom-close-btn 同一套視覺，只在鍵盤導覽時顯示）。 */
        #drag-item:focus-visible { outline: 2px solid #0071e3; outline-offset: 2px; }
        #drop-target .icon-wrapper { cursor: pointer; transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1), filter 160ms cubic-bezier(0.23, 1, 0.32, 1); }
        /* 按下去就縮一下：這顆圖示點下去會開啟選擇資料夾的對話框，是一顆
           按鈕，回饋要出現在「按住的當下」而不是放開之後，使用者才知道
           自己確實按到了。拖曳中的放大（.drag-over）走同一條 transition，
           原本的 0.2s 在拖曳過程中會慢半拍，一起縮短到 160ms。 */
        #drop-target:active .icon-wrapper { transform: scale(0.96); }
        /* 安裝目的地圖示同樣原本只有滑鼠 click 事件，補上鍵盤操作後也要
           有焦點框。外框畫在內部的 .icon-wrapper 上而不是整個 .icon-box
           上，讓它跟 #drag-item 一樣只框住圖示本身，不會把底下的標籤與
           長路徑文字一起框進去。 */
        #drop-target:focus-visible { outline: none; }
        #drop-target:focus-visible .icon-wrapper { outline: 2px solid #0071e3; outline-offset: 2px; }

        .arrow-box { height: 90px; display: flex; align-items: center; }
        .arrow-svg { width: 28px; height: 28px; }

        .label { margin-top: 12px; font-size: 13px; font-weight: 500; color: #1d1d1f; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #path-preview { margin-top: 4px; font-size: 11px; color: #86868b; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }

        .drag-over .icon-wrapper { transform: scale(1.08); filter: drop-shadow(0 4px 12px rgba(0, 125, 250, 0.2)); }
        /* 系統要求減少動態效果時，只收掉「介面自己在動」的部分；使用者拖著
           圖示走的位移是直接操作，關掉反而會讓人不知道自己拖到哪裡 */
        @media (prefers-reduced-motion: reduce) {
            .drag-inner, #drop-target .icon-wrapper { transition: none; }
        }

        /* 桌面捷徑小勾選：刻意做得不搶視覺 */
        /* 釘死在視窗底部的工具列，不參與 main-view 的垂直置中；
           bottom: 20px 對應 Apple HIG 視窗內容離左右下邊界的標準 20pt 留白慣例 */
        .bottom-bar { position: fixed; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 50; }
        .desktop-shortcut-row { display: flex; align-items: center; gap: 6px; }
        .desktop-shortcut-row input[type="checkbox"] { width: 13px; height: 13px; cursor: pointer; }
        .desktop-shortcut-row label { font-size: 11px; color: #86868b; cursor: pointer; user-select: none; }

        /* 進度條 */
        .install-progress-wrap { width: 320px; margin-top: 18px; display: none; }
        .install-progress-text { font-size: 11px; color: #86868b; text-align: center; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .install-progress-track { width: 100%; height: 4px; background: #e5e5ea; border-radius: 2px; overflow: hidden; }
        .install-progress-fill { width: 0%; height: 100%; background: #0071e3; transition: width 0.2s ease; }

        /* 通用質感彈窗樣式。這些彈窗不畫成浮在半透明遮罩上的白色卡片，而是
           整片換成跟主畫面同一個底色的完整畫面——解除安裝端（uninstall.html
           的 .nice-view）本來就是這種作法，安裝端的 EULA 頁、密碼頁、相依
           元件安裝頁也是，只有這幾個 modal 例外。統一成同一種語彙後，整個
           安裝流程的每一頁都是「換一整頁」，而不是有時換頁、有時疊卡片。 */
        .nice-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #f5f5f7;
            display: none; justify-content: center; align-items: center; z-index: 10000;
            opacity: 0; transition: opacity 0.3s ease; padding: 24px;
        }
        .nice-modal-overlay.active { display: flex; opacity: 1; }
        .nice-modal-box {
            text-align: center;
            transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 480px; max-height: 80vh; overflow-y: auto;
        }
        .nice-modal-overlay.active .nice-modal-box { transform: scale(1); }
        .nice-icon {
            width: 44px; height: 44px; background: #34C759; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; margin: 0 auto 12px auto; color: white;
        }
        .nice-icon.error { background: #FF3B30; }
        .nice-icon.warn { background: #FF9500; }
        .nice-icon.update { background: #0071e3; }
        /* 警示紅：跟 .error 的亮紅區分開來，飽和度/明度收斂過，用在「要安裝的
           版本比目前已安裝的還舊」這種需要使用者留意、但不是錯誤的情境 */
        .nice-icon.downgrade { background: #C0392B; }
        .nice-title { font-size: 17px; font-weight: 600; color: #1d1d1f; margin-bottom: 6px; }
        .nice-message { font-size: 13px; color: #86868b; margin-bottom: 20px; text-align: left; line-height: 1.6; }
        .nice-btn {
            background: #0071e3; color: white; border: none;
            /* 真實抓到的問題：中文字（CJK）字型本身的字面框（glyph metrics）
               上下不對稱，就算 line-height 調整過，實測文字上方留白 11px、
               下方 14px，還是偏上約 3px。這裡改用上下不對稱的 padding
               直接補償（9px/7px，總高度跟原本的 8px/8px 一致，按鈕本身
               大小不變），不再靠調 line-height 去猜。 */
            padding: 9px 24px 7px 24px;
            border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer;
            transition: background 0.2s; outline: none; margin: 0 4px;
            line-height: 1.2;
        }
        .nice-btn:hover { background: #0077ED; }
        /* 真實抓到的無障礙問題：outline: none 拿掉瀏覽器預設的鍵盤焦點框，
           但沒有補一個替代的視覺標記——用 Tab 鍵切換時，使用者完全看不出
           目前選到哪個按鈕。用 :focus-visible（只在鍵盤導覽時顯示，滑鼠
           點擊不顯示，避免點擊後殘留一圈看起來像 bug）補上藍色外框。 */
        .nice-btn:focus-visible { outline: 2px solid #0071e3; outline-offset: 2px; }
        .nice-btn.secondary { background: #e5e5ea; color: #1d1d1f; }
        .nice-btn.secondary:hover { background: #d8d8dd; }
        /* 「略過偵測，強制繼續」這類最後手段選項：視覺份量刻意比 .secondary
           更輕，不跟主要按鈕搶注意力，避免使用者養成習慣每次都跳過偵測 */
        .nice-btn.tertiary {
            background: transparent; color: #86868b; padding: 8px 12px;
            font-size: 12px; text-decoration: underline; text-underline-offset: 2px;
        }
        .nice-btn.tertiary:hover { color: #1d1d1f; background: transparent; }

        /* 安裝完成但有幾項沒成功時的警告清單（F01）。安裝視窗固定 600x420、
           不可調整大小，非致命失敗最多五種（服務／排程工作／系統還原點／
           安裝後置腳本／捷徑），所以限制高度並允許自己捲動，不讓清單把
           「完成」按鈕擠出畫面。overflow-wrap: anywhere 是給服務名稱、
           檔案路徑這類沒有空白可斷行的長字串用的——不加的話最窄寬度下
           會把整個彈窗撐寬、文字被切掉。 */
        .warn-list {
            display: none; text-align: left; background: #fff8ec;
            border: 1px solid #ffd9a8; border-radius: 10px;
            padding: 10px 12px; margin-bottom: 16px;
        }
        .warn-list.active { display: block; }
        .warn-list-title { font-size: 12px; font-weight: 600; color: #8a5200; margin-bottom: 4px; }
        /* 捲動的是 ul 而不是整個 .warn-list：標題留在捲動範圍外才不會被捲走，
           項目多到需要捲動時使用者仍看得到「這些是沒成功的項目」這個前提。 */
        .warn-list ul { margin: 0; padding: 0 0 0 16px; max-height: 92px; overflow-y: auto; }
        .warn-list li { font-size: 12px; color: #7a4a00; line-height: 1.55; overflow-wrap: anywhere; }

        .launch-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 4px 0 16px 0; }
        .launch-row input[type="checkbox"] { width: 14px; height: 14px; cursor: pointer; }
        .launch-row label { font-size: 12px; color: #1d1d1f; cursor: pointer; user-select: none; }

        /* EULA 頁 */
        .eula-view { display: none; flex-direction: column; width: 480px; max-height: 85vh; margin-top: 8px; }
        .eula-view.active { display: flex; }
        .eula-title { font-size: 16px; font-weight: 600; color: #1d1d1f; margin-bottom: 10px; text-align: center; }
        .eula-text-box { flex: 1; overflow-y: auto; background: white; border: 1px solid #e5e5ea; border-radius: 10px; padding: 16px; font-size: 12px; color: #3a3a3c; line-height: 1.7; white-space: pre-wrap; max-height: 320px; }
        .eula-actions { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }

        /* 密碼關卡：跟 eula-view 同一種「前置關卡」模式，出現在 EULA 之前。 */
        .password-view { display: none; flex-direction: column; align-items: center; width: 360px; margin-top: 8px; }
        .password-view.active { display: flex; }
        .password-title { font-size: 16px; font-weight: 600; color: #1d1d1f; margin-bottom: 10px; text-align: center; }
        .password-hint { font-size: 12px; color: #6e6e73; margin-bottom: 16px; text-align: center; }
        .password-input { width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid #e5e5ea; border-radius: 10px; font-size: 14px; color: #1d1d1f; font-family: inherit; }
        .password-input:focus { outline: none; border-color: #0071e3; box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15); }
        .password-input.invalid { border-color: #ff3b30; }
        .password-error { display: none; font-size: 12px; color: #ff3b30; margin-top: 8px; text-align: center; }
        .password-error.active { display: block; }
        .password-actions { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }

        /* 相依元件自動安裝頁：跟 eula-view 一樣是獨立畫面（不是 modal），
           安裝期間取代 mainView 顯示，裝完/失敗後切回去。 */
        .dep-install-view { display: none; flex-direction: column; align-items: center; width: 360px; margin-top: 8px; }
        .dep-install-view.active { display: flex; }
        .dep-install-title { font-size: 15px; font-weight: 600; color: #1d1d1f; margin-bottom: 16px; text-align: center; }
        .dep-install-view .install-progress-wrap { display: block; margin-top: 0; }

        /* 底部小提示 toast：裝完相依元件、切回拖曳頁面後短暫顯示 */
        .dep-toast {
            position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(8px);

        }

    </style>

<body>

    <script>
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // ---------------- 多語言介面（chrome）----------------
        // 安裝檔的介面語言不給使用者選，由 installer_core.py 依系統語言自動
        // 偵測後透過 get_ui_language() 提供，這裡只負責套用。EULA 文字語言
        // 不受這份翻譯表限制（開發者可自訂任意語言代碼），是分開的另一個機制。
        const I18N = {

                installing: "正在安裝...",

                upgrade_same_msg: "已安裝的版本是 {{old}}，這次要安裝的版本是 {{new}}，並不比目前已安裝的版本新。選擇「仍要繼續安裝」會用這次的版本覆蓋現有安裝，選擇「取消」則結束安裝程式。",
                upgrade_older_title: "已安裝較新的版本",
                upgrade_older_msg: "已安裝的版本是 {{old}}，比這次要安裝的版本 {{new}} 還新，這次要安裝的版本比較舊。選擇「仍要繼續安裝」會用這次較舊的版本覆蓋現有安裝，選擇「取消」則結束安裝程式。",

            "en": {

                password_gate_title: "This installer requires a password",

                password_input_placeholder: "Password",
                password_wrong_error: "Incorrect password, please try again",
                btn_password_submit: "OK",
                eula_title: "End User License Agreement",
                btn_decline: "Decline",
                btn_accept: "Agree & Continue",
                loading: "Loading...",
                install_destination_label: "Install Location",
                progress_preparing: "Preparing...",
                desktop_shortcut_label: "Create a desktop shortcut",
                upgrade_default_title: "Existing installation detected",
                btn_cancel: "Cancel",
                btn_update_overwrite: "Update",
                btn_continue_anyway: "Continue Anyway",
                dep_modal_title: "Recommended components missing",
                dep_download_link: "Download",
                btn_install_dependency: "Install Automatically",
                dep_installing_title: "Installing dependencies",
                dep_installing_text: "Installing {{name}}...",
                dep_installed_toast: "Installed: {{names}}",
                dep_install_failed_toast: "{{names}} could not be installed automatically — please use the link above to install manually",
                install_success_title: "Installation Complete",
                install_failed_title: "Installation Failed",
                install_warnings_title: "Installation finished, but the following did not succeed:",
                launch_after_install_label: "Launch the app after installation",
                btn_done: "Done",
                initializing_install: "Initializing installation...",
                installing: "Installing...",
                install_complete_path: "Installation complete!",
                upgrade_newer_title: "New version available",
                upgrade_newer_msg: "Version {{old}} is currently installed. Would you like to update to version {{new}}?",
                upgrade_same_title: "The installed version is newer or the same",
                upgrade_same_msg: "The installed version is {{old}}; the version you're about to install is {{new}}, which is not newer. Choose \"Continue Anyway\" to overwrite the existing installation, or \"Cancel\" to quit.",
                upgrade_older_title: "A newer version is already installed",
                upgrade_older_msg: "The installed version is {{old}}, which is newer than the version you're about to install ({{new}}). Choose \"Continue Anyway\" to overwrite it with this older version, or \"Cancel\" to quit.",
                process_running_title: "Application is currently running",
                btn_close_and_continue: "Close it and continue installing",
                btn_force_continue: "Closing didn't help? Skip detection and continue anyway",
                file_locked_title: "File in use",
                btn_close_locking_process: "Close this program",
            },
        };
        let currentLang = "zh-TW";
        function t(key, vars) {
            let s = (I18N[currentLang] && I18N[currentLang][key]) || (I18N["zh-TW"][key] || key);
            if (vars) {
                for (const k in vars) s = s.replaceAll(`{{${k}}}`, vars[k]);
            }
            return s;
        }
        function applyI18n(lang) {
            currentLang = I18N[lang] ? lang : "zh-TW";
            document.documentElement.setAttribute("lang", currentLang);
            document.querySelectorAll("[data-i18n]").forEach(el => { el.innerText = t(el.dataset.i18n); });
            document.querySelectorAll("[data-i18n-title]").forEach(el => { el.setAttribute("title", t(el.dataset.i18nTitle)); });
            document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.setAttribute("placeholder", t(el.dataset.i18nPlaceholder)); });
        }
        function closeWindow() { if (window.pywebview && window.pywebview.api && window.pywebview.api.close_window) { pywebview.api.close_window(); } }

        // 自訂視窗拖曳：不依賴 pywebview 內建的 pywebview-drag-region（該機制拖曳開始瞬間
        // 會跳一下，100% 縮放下也會發生，判斷是機制本身的問題），改成自己算滑鼠位移量。
        // 按下當下記錄一次基準點，之後每一幀只送「相對位移量」給後端搬動視窗，
        // 用 requestAnimationFrame 節流，避免 mousemove 觸發太頻繁造成 IPC 塞車。
        (function setupCustomDrag() {
            const dragRegion = document.getElementById('dragRegion');
            let isDragging = false;
            let pendingPos = null;

            function dragLoop() {
                if (!isDragging) return;
                if (pendingPos) {
                    pywebview.api.drag_move(pendingPos[0], pendingPos[1]);
                    pendingPos = null;
                }
                requestAnimationFrame(dragLoop);
            }

            dragRegion.addEventListener('mousedown', (e) => {
                isDragging = true;
                pywebview.api.start_drag(e.screenX, e.screenY);
                requestAnimationFrame(dragLoop);
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                // 防呆：左鍵其實已經放開了就強制結束拖曳，避免 mouseup 被漏接
                // （常見於拖到螢幕邊緣放開滑鼠）導致視窗卡在跟著滑鼠跑。
                if ((e.buttons & 1) === 0) {
                    isDragging = false;
                    pendingPos = null;
                    pywebview.api.end_drag();
                    return;
                }
                pendingPos = [e.screenX, e.screenY];
            });
            document.addEventListener('mouseup', () => {
                if (isDragging) { isDragging = false; pendingPos = null; pywebview.api.end_drag(); }
            });
        })();

        function showModal(title, message, isError = false, showLaunchOption = false) {
            const modal = document.getElementById('custom-modal');
            const icon = document.getElementById('modal-icon');
            document.getElementById('modal-title').innerText = title;
            const msgEl = document.getElementById('modal-message');
            msgEl.innerText = message;
            msgEl.style.display = message ? 'block' : 'none';

            if (isError) {
                icon.className = 'nice-icon error';
                icon.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
            } else {
                icon.className = 'nice-icon';
                icon.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
            }
            document.getElementById('launchRow').style.display = showLaunchOption ? 'flex' : 'none';
            // 這個彈窗是共用的（覆蓋安裝提示、相依元件、安裝結果都走它），
            // 每次顯示先把警告清單清空收起來，避免上一次安裝留下的內容
            // 出現在另一個用途的彈窗上。要顯示警告的呼叫端在 showModal()
            // 之後自己呼叫 renderInstallWarnings()。
            clearInstallWarnings();
            modal.classList.add('active');
        }

        function clearInstallWarnings() {
            const box = document.getElementById('installWarnings');
            box.classList.remove('active');
            document.getElementById('installWarningItems').innerHTML = '';
        }

        // F01：後端 trigger_installation() 的成功結果一直帶著 warnings
        // （Windows 服務／排程工作／系統還原點／安裝後置腳本／捷徑建立失敗
        // 這些不中止安裝的失敗），但前端原本只判斷 status 就顯示安裝成功
        // 畫面，這份清單從來沒有被讀取——使用者以為打包時設定的服務已經
        // 正常裝好，直到某天發現它根本不存在。
        //
        // 用 textContent 而不是 innerHTML 填內容：警告字串裡含使用者自己
        // 填的服務名稱、腳本回傳的錯誤訊息，不該被當成 HTML 解析。
        function renderInstallWarnings(warnings) {
            if (!warnings || warnings.length === 0) return;
            const list = document.getElementById('installWarningItems');
            warnings.forEach((w) => {
                const li = document.createElement('li');
                li.textContent = w;
                list.appendChild(li);
            });
            document.getElementById('installWarnings').classList.add('active');
        }

        let installSucceeded = false;

        async function closeModal() {
            document.getElementById('custom-modal').classList.remove('active');
            if (installSucceeded && document.getElementById('launchAfterInstall').checked) {
                await pywebview.api.launch_app();
            }
            if (installSucceeded) {
                closeWindow();
            }
        }

        // mainView 跟 bottomBar（底部工具列）要一起顯示/隱藏：
        // EULA 頁顯示的時候，底部那個「建立桌面捷徑」勾選項也不該露出來。
        function setMainViewVisible(visible) {
            document.getElementById('mainView').style.display = visible ? 'flex' : 'none';
            document.getElementById('bottomBar').style.display = visible ? 'flex' : 'none';
        }

        // ---------------- EULA ----------------
        function declineEula() { closeWindow(); }
        function acceptEula() {
            document.getElementById('eulaView').classList.remove('active');
            setMainViewVisible(true);
            afterEula();
        }

        // ---------------- 覆蓋安裝偵測 ----------------
        // 這裡按下確認鈕只代表「使用者知情並同意」，還沒有任何檔案被動到；
        // 真正移除舊版本的動作延後到使用者實際拖曳圖示、觸發
        // trigger_installation() 之後才由後端執行（見 installer_core.py），
        // 這樣使用者按完確認鈕、還沒拖曳圖示前反悔關視窗，舊版本完全不受影響。
        let pendingExistingInstall = null;
        function cancelUpgrade() { document.getElementById('upgradeModal').classList.remove('active'); closeWindow(); }
        function confirmUpgrade() {
            document.getElementById('upgradeModal').classList.remove('active');
            afterUpgradeCheck();
        }

        // ---------------- 相依元件警告 ----------------
        // 記住這次偵測到缺少的相依元件清單，「自動安裝」按鈕按下去時要依序
        // 處理這份清單裡的每一個（見 installMissingDependencies()）。
        let pendingDependencyWarnings = [];

        function closeDepModal() { document.getElementById('depModal').classList.remove('active'); }

        function showDepToast(message) {
            const toast = document.getElementById('depToast');
            toast.innerText = message;
            toast.classList.add('active');
            setTimeout(() => { toast.classList.remove('active'); }, 4000);
        }

        window.updateDependencyInstallProgress = function (percent, message) {
            document.getElementById('depInstallProgressText').innerText = message;
            document.getElementById('depInstallProgressFill').style.width = percent + '%';
        };

        // 使用者在相依元件彈窗按下「自動安裝」：依序下載＋靜默安裝每一個
        // 缺少的元件（見 installer_core.py 的 install_dependency()，backend
        // 用既有的 evaluate_js 推播模式回報進度，這裡單純 await 每一次呼叫、
        // 拿到最終結果才繼續下一個，不需要另外寫輪詢）。全部處理完，不論
        // 成功與否都切回拖曳頁面，底部用小提示告知結果。
        async function installMissingDependencies() {
            const warnings = pendingDependencyWarnings;
            document.getElementById('depModal').classList.remove('active');
            setMainViewVisible(false);
            document.getElementById('depInstallView').classList.add('active');

            const installed = [];
            const failed = [];
            for (const w of warnings) {
                document.getElementById('depInstallProgressText').innerText = t('dep_installing_text', { name: w.name });
                document.getElementById('depInstallProgressFill').style.width = '0%';
                const result = await pywebview.api.install_dependency(w.key);
                if (result.status === 'success') {
                    installed.push(w.name);
                } else {
                    failed.push(w.name);
                }
            }

            document.getElementById('depInstallView').classList.remove('active');
            setMainViewVisible(true);

            if (installed.length > 0 && failed.length === 0) {
                showDepToast(t('dep_installed_toast', { names: installed.join('、') }));
            } else if (failed.length > 0) {
                showDepToast(t('dep_install_failed_toast', { names: failed.join('、') }));
            }
        }

        const dragItem = document.getElementById('drag-item');
        const dropTarget = document.getElementById('drop-target');
        const pathPreview = document.getElementById('path-preview');
        const appLabel = document.getElementById('app_name_label');

        window.addEventListener('pywebviewready', async () => {
            const uiLanguage = await pywebview.api.get_ui_language();
            applyI18n(uiLanguage);

            const defaultPath = await pywebview.api.get_default_path();
            const appName = await pywebview.api.get_app_name();
            pathPreview.innerText = defaultPath;
            pathPreview.setAttribute('title', defaultPath);
            appLabel.innerText = appName;
            appLabel.setAttribute('title', appName);

            // 密碼關卡：出現在 EULA 之前，通過驗證才會往下走既有的
            // EULA/主拖曳畫面流程；沒有密碼保護的安裝檔完全跳過這一段。
            const passwordProtected = await pywebview.api.is_password_protected();
            if (passwordProtected) {
                setMainViewVisible(false);
                document.getElementById('passwordView').classList.add('active');
                document.getElementById('passwordInput').focus();
            } else {
                checkEulaAndProceed();
            }
        });

        async function checkEulaAndProceed() {
            const eulaText = await pywebview.api.get_eula_text();
            if (eulaText && eulaText.trim().length > 0) {
                document.getElementById('eulaTextBox').innerText = eulaText;
                setMainViewVisible(false);
                document.getElementById('eulaView').classList.add('active');
            } else {
                setMainViewVisible(true);
                afterEula();
            }
        }

        // ---------------- 密碼關卡 ----------------
        function declinePassword() { closeWindow(); }
        async function submitPassword() {
            const input = document.getElementById('passwordInput');
            const errorEl = document.getElementById('passwordError');
            const ok = await pywebview.api.verify_install_password(input.value);
            if (ok) {
                document.getElementById('passwordView').classList.remove('active');
                errorEl.classList.remove('active');
                input.classList.remove('invalid');
                checkEulaAndProceed();
            } else {
                errorEl.classList.add('active');
                input.classList.add('invalid');
                input.focus();
                input.select();
            }
        }
        document.getElementById('passwordInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitPassword();
        });

        async function afterEula() {
            const existing = await pywebview.api.check_existing_install();
            if (existing && existing.exists) {
                const titleEl = document.getElementById('upgradeTitle');
                const msgEl = document.getElementById('upgradeMessage');
                const btnEl = document.getElementById('confirmUpgradeBtn');
                const iconEl = document.getElementById('upgradeIcon');

                if (existing.is_newer) {
                    // 本機是舊版：這次要裝的版本比較新，藍色「更新」圖示
                    iconEl.className = 'nice-icon update';
                    iconEl.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 3v6h-6"></path></svg>';
                    titleEl.innerText = t('upgrade_newer_title');
                    msgEl.innerText = t('upgrade_newer_msg', { old: existing.version, new: existing.new_version });
                    btnEl.innerText = t('btn_update_overwrite');
                } else if (existing.is_same) {
                    // 版本一致：維持原本的樣式與文字
                    iconEl.className = 'nice-icon warn';
                    iconEl.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L14.7 3.86a2 2 0 0 0-3.4 0z"></path></svg>';
                    titleEl.innerText = t('upgrade_same_title');
                    msgEl.innerText = t('upgrade_same_msg', { old: existing.version, new: existing.new_version });
                    btnEl.innerText = t('btn_continue_anyway');
                } else {
                    // 本機版本比較新（這次要裝的版本比較舊）：警示色，明確告知使用者
                    // 要裝的版本比較舊，讓使用者自己決定要不要繼續
                    iconEl.className = 'nice-icon downgrade';
                    iconEl.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L14.7 3.86a2 2 0 0 0-3.4 0z"></path></svg>';
                    titleEl.innerText = t('upgrade_older_title');
                    msgEl.innerText = t('upgrade_older_msg', { old: existing.version, new: existing.new_version });
                    btnEl.innerText = t('btn_continue_anyway');
                }
                document.getElementById('upgradeModal').classList.add('active');
            } else {
                afterUpgradeCheck();
            }
        }

        async function afterUpgradeCheck() {
            const warnings = await pywebview.api.get_dependency_warnings();
            if (warnings && warnings.length > 0) {
                pendingDependencyWarnings = warnings;
                document.getElementById('depMessage').innerHTML = warnings
                    .map(w => `• ${w.name}（<a href="#" onclick="pywebview.api.open_url('${w.url}'); return false;">${t('dep_download_link')}</a>）`)
                    .join('<br>');
                document.getElementById('depModal').classList.add('active');
            }
        }

        // 點安裝目的地圖示、以及用鍵盤選到它後按 Enter/空白鍵，都走這同一個
        // 函式，兩邊行為不會分岔。
        async function chooseInstallFolder() {
            const newPath = await pywebview.api.select_folder();
            if (newPath) { pathPreview.innerText = newPath; pathPreview.setAttribute('title', newPath); }
        }

        dropTarget.addEventListener('click', async () => {
            await chooseInstallFolder();
        });

        // ---------------- 拖曳安裝（自繪 + 彈簧）----------------
        // 不使用瀏覽器內建的拖曳（draggable 屬性那一套），因為那條路徑被拖著
        // 跑的影像是作業系統畫的，外觀完全不受控，也做不出按下的即時回饋、
        // 沒放中的彈回、放進去的吸入。改成自己用 pointer 事件搬圖示，位移交給
        // 彈簧——彈簧的動畫可以在任何一刻被使用者接手，這是「彈回途中還抓得
        // 住」的前提，換成固定長度的 CSS 動畫就做不到。
        //
        // 下面這幾個數字是在互動原型上實際拖過幾十次調出來的觀感值，不是推導
        // 出來的常數，往後要微調直接改這裡。
        const SPRING_BOUNCE = 0.30;     // 0 = 完全不過衝，越大越晃
        const SPRING_RESPONSE = 0.25;   // 彈簧的自然週期（秒）。彈簧沒有固定長度，
                                        // 這個值是「多快到位」，不是「動畫幾秒」
        const PICKUP_SCALE = 1.06;      // 拿起來就是離開桌面靠近眼睛，所以變大
        const ABSORB_MS = 320;          // 命中後被吸進資料夾的時間
        const SWALLOW_MS = 300;         // 資料夾吞下去的那一口有多長
        const SWALLOW_SQUASH = 0.94;    // 壓到比原始大小更小的那個底
        const HIT_TOLERANCE = 25;       // 命中判定往外撐幾 px（重疊即命中的容差）
        const MAGNET_STRENGTH = 0.20;   // 靠近資料夾時被拉過去的程度
        const MAGNET_RANGE = 150;       // 這個距離內磁吸才開始作用
        const EASE_OUT = 'cubic-bezier(0.23, 1, 0.32, 1)';
        // 更強的 ease-out：幾乎在第一幀就衝出去，後段收得很慢。用在「已經成定局」
        // 的動作（圖示被吸進去、資料夾被壓下去）——這類動作開頭慢半拍就會拖沓，
        // 使用者要的是它趕快演完，不是欣賞它加速。
        const EASE_SNAP = 'cubic-bezier(0.16, 1, 0.3, 1)';

        const dragInner = dragItem.querySelector('.drag-inner');
        const dragGhost = document.getElementById('dragGhost');
        const dropSlot = dropTarget.querySelector('.icon-wrapper');
        const reduceMotionQuery = window.matchMedia
            ? window.matchMedia('(prefers-reduced-motion: reduce)')
            : { matches: false };
        function motionReduced() { return reduceMotionQuery.matches; }

        // 彈簧：用「回彈 / 多快到位」兩個參數換算成一般的彈簧方程式。X 跟 Y
        // 各自獨立一條，合成單一條會在兩軸速度不同時失去同步。
        function makeSpring() { return { x: 0, v: 0, target: 0 }; }
        function stepSpring(sp, dt) {
            const zeta = 1 - SPRING_BOUNCE;
            const w = (2 * Math.PI) / SPRING_RESPONSE;
            const k = w * w;
            const c = 2 * zeta * w;
            let remaining = dt;
            while (remaining > 0) {
                // 固定子步長積分，掉幀時彈簧才不會發散
                const h = Math.min(remaining, 1 / 240);
                sp.v += (-k * (sp.x - sp.target) - c * sp.v) * h;
                sp.x += sp.v * h;
                remaining -= h;
            }
        }
        function springAtRest(sp) {
            return Math.abs(sp.x - sp.target) < 0.05 && Math.abs(sp.v) < 0.05;
        }

        const dragX = makeSpring();
        const dragY = makeSpring();
        let dragActive = false;
        let dragPointerId = null;
        let dragStartPoint = { x: 0, y: 0 };
        let dragBaseOffset = { x: 0, y: 0 };
        let dragHistory = [];
        let dragHovering = false;
        let dragAbsorbing = false;
        let dragRaf = null;
        let dragLastFrame = 0;

        function renderDragPosition() {
            dragItem.style.transform =
                'translate3d(' + dragX.x.toFixed(2) + 'px, ' + dragY.x.toFixed(2) + 'px, 0)';
        }

        function setPickedUp(on) {
            dragInner.style.transform = 'scale(' + (on ? PICKUP_SCALE : 1) + ')';
            dragInner.style.filter = on ? 'drop-shadow(0 14px 22px rgba(0,0,0,0.20))' : 'none';
            dragGhost.classList.toggle('shown', on);
        }

        // 命中判定：重疊即命中，容差把資料夾的判定範圍往外撐。不採用依放開
        // 速度往前推算落點的做法——那適合可以反悔的動作，安裝會實際寫進使用者
        // 的系統，不該因為手一抖甩過去就觸發。
        function dragIsOverDropTarget() {
            const a = dragItem.getBoundingClientRect();
            const b = dropSlot.getBoundingClientRect();
            return !(a.right < b.left - HIT_TOLERANCE || a.left > b.right + HIT_TOLERANCE ||
                     a.bottom < b.top - HIT_TOLERANCE || a.top > b.bottom + HIT_TOLERANCE);
        }

        function setDropHover(on) {
            if (dragHovering === on) return;
            dragHovering = on;
            dropTarget.classList.toggle('drag-over', on);
        }

        function dragLoop(now) {
            const dt = Math.min((now - dragLastFrame) / 1000, 1 / 30);
            dragLastFrame = now;
            if (!dragActive) { stepSpring(dragX, dt); stepSpring(dragY, dt); }
            renderDragPosition();
            if (dragActive || !(springAtRest(dragX) && springAtRest(dragY))) {
                dragRaf = requestAnimationFrame(dragLoop);
            } else {
                dragX.x = dragX.target; dragY.x = dragY.target;
                dragX.v = 0; dragY.v = 0;
                renderDragPosition();
                dragRaf = null;
                if (!dragAbsorbing) setPickedUp(false);
            }
        }
        function ensureDragLoop() {
            if (dragRaf === null) {
                dragLastFrame = performance.now();
                dragRaf = requestAnimationFrame(dragLoop);
            }
        }

        dragItem.addEventListener('pointerdown', (e) => {
            if (dragAbsorbing) return;
            e.preventDefault();
            dragItem.setPointerCapture(e.pointerId);
            dragPointerId = e.pointerId;
            dragActive = true;
            dragItem.classList.add('grabbing');
            // 從畫面上「現在」的位置接手，所以彈回途中也抓得住，而且不會跳位
            dragBaseOffset = { x: dragX.x, y: dragY.x };
            dragStartPoint = { x: e.clientX, y: e.clientY };
            dragX.v = 0; dragY.v = 0;
            dragHistory = [{ x: e.clientX, y: e.clientY, t: performance.now() }];
            setPickedUp(true);
            ensureDragLoop();
        });

        dragItem.addEventListener('pointermove', (e) => {
            if (!dragActive || e.pointerId !== dragPointerId) return;
            let px = dragBaseOffset.x + (e.clientX - dragStartPoint.x);
            let py = dragBaseOffset.y + (e.clientY - dragStartPoint.y);

            if (MAGNET_STRENGTH > 0) {
                // 磁吸：越靠近資料夾越往它靠。這段不再完全跟手，所以強度壓得
                // 很低，只當成臨門一腳的暗示，不是幫使用者對準的主力（對準靠
                // 的是上面那個命中容差）。
                const a = dragItem.getBoundingClientRect();
                const b = dropSlot.getBoundingClientRect();
                const cx = a.left + a.width / 2, cy = a.top + a.height / 2;
                const tx = b.left + b.width / 2, ty = b.top + b.height / 2;
                const d = Math.hypot(tx - cx, ty - cy);
                if (d < MAGNET_RANGE) {
                    const pull = (1 - d / MAGNET_RANGE) * MAGNET_STRENGTH;
                    px += (tx - cx) * pull;
                    py += (ty - cy) * pull;
                }
            }

            dragX.x = px; dragX.target = px;
            dragY.x = py; dragY.target = py;
            renderDragPosition();
            dragHistory.push({ x: e.clientX, y: e.clientY, t: performance.now() });
            if (dragHistory.length > 6) dragHistory.shift();
            setDropHover(dragIsOverDropTarget());
        });

        function endDragGesture(e) {
            if (!dragActive || (e && e.pointerId !== dragPointerId)) return;
            dragActive = false;
            dragItem.classList.remove('grabbing');
            if (dragPointerId !== null && dragItem.hasPointerCapture(dragPointerId)) {
                dragItem.releasePointerCapture(dragPointerId);
            }
            dragPointerId = null;

            const first = dragHistory[0];
            const last = dragHistory[dragHistory.length - 1];
            const dt = Math.max((last.t - first.t) / 1000, 0.001);
            const vx = (last.x - first.x) / dt;
            const vy = (last.y - first.y) / dt;

            const hit = dragIsOverDropTarget();

            if (hit) {
                // 命中時不在這裡收掉放大狀態——放大是 CSS class 控制的，
                // 收回的 transition 會跟接下來的吸入動畫搶同一個 transform，
                // 兩股力道疊在一起就是那種抽搐感。改由 absorbIntoDropTarget()
                // 從目前的放大狀態接手，一路演到結束。
                absorbIntoDropTarget();
                return;
            }
            setDropHover(false);
            // 沒放中：彈回原位，並把手上的速度交接給彈簧，拖曳與動畫之間才不會
            // 有一個看得出來的接縫
            dragX.target = 0; dragY.target = 0;
            setPickedUp(false);
            if (motionReduced()) {
                dragX.x = 0; dragY.x = 0; dragX.v = 0; dragY.v = 0;
                renderDragPosition();
            } else {
                dragX.v = vx; dragY.v = vy;
                ensureDragLoop();
            }
        }
        dragItem.addEventListener('pointerup', endDragGesture);
        dragItem.addEventListener('pointercancel', endDragGesture);

        // 命中：圖示被吸進資料夾，資料夾同時很輕地回應一下，接著才真的開始
        // 安裝。圖示不會縮到完全消失——那看起來像憑空蒸發，不像被裝進去。
        function absorbIntoDropTarget() {
            dragAbsorbing = true;
            const a = dragItem.getBoundingClientRect();
            const b = dropSlot.getBoundingClientRect();
            const dx = (b.left + b.width / 2) - (a.left + a.width / 2);
            const dy = (b.top + b.height / 2) - (a.top + a.height / 2);
            const duration = motionReduced() ? 0 : ABSORB_MS;

            dragInner.style.filter = 'none';
            dragInner.animate(
                [{ transform: 'scale(' + PICKUP_SCALE + ')' }, { transform: 'scale(0.34)' }],
                { duration: duration, easing: EASE_SNAP, fill: 'forwards' }
            );
            const flight = dragItem.animate(
                [
                    { transform: 'translate3d(' + dragX.x + 'px, ' + dragY.x + 'px, 0)', opacity: 1 },
                    { transform: 'translate3d(' + (dragX.x + dx) + 'px, ' + (dragY.x + dy) + 'px, 0)', opacity: 0 }
                ],
                { duration: duration, easing: EASE_SNAP, fill: 'forwards' }
            );
            // 資料夾吞下去的那一口：放開的當下資料夾已經是放大狀態（拖曳中的
            // 1.08），從那裡直接開始縮，經過原始大小時不停，一路壓到比原始
            // 大小更小，再彈回原始大小——像被壓了一下然後回彈，而不是先漲大
            // 再收回。
            //
            // 這裡不用 delay：放大是 CSS class 給的，一旦把 class 收掉又還沒
            // 輪到動畫接手，中間那段時間沒有任何一方在管這個 transform，資料夾
            // 會先瞬間縮回原大小、乾等、再跳回放大開始演，看起來就是卡住。
            // 動畫必須從第一幀就接管。
            dropSlot.style.transition = 'none';
            dragHovering = false;
            dropTarget.classList.remove('drag-over');
            if (motionReduced()) {
                dropSlot.style.transition = '';
            } else {
                const swallow = dropSlot.animate(
                    [
                        // 壓下去這段一開始就衝到底：這個動作已成定局，開頭慢半拍
                        // 只會顯得拖沓
                        { transform: 'scale(1.08)', offset: 0, easing: EASE_SNAP },
                        { transform: 'scale(' + SWALLOW_SQUASH + ')', offset: 0.35, easing: EASE_OUT },
                        { transform: 'scale(1.012)', offset: 0.72 },
                        { transform: 'scale(1)', offset: 1 }
                    ],
                    { duration: SWALLOW_MS, fill: 'forwards' }
                );
                swallow.finished.catch(() => {}).then(() => {
                    swallow.cancel();
                    dropSlot.style.transition = '';
                });
            }

            flight.finished.catch(() => {}).then(() => {
                // 圖示回到原位並恢復可見：安裝失敗或被取消時會退回主畫面，
                // 那時候圖示本來就該還在原本的地方
                dragItem.getAnimations().forEach((anim) => anim.cancel());
                dragInner.getAnimations().forEach((anim) => anim.cancel());
                dragX.x = 0; dragY.x = 0; dragX.v = 0; dragY.v = 0;
                dragX.target = 0; dragY.target = 0;
                renderDragPosition();
                setPickedUp(false);
                dragAbsorbing = false;
                // 圖示剛剛才淡出，瞬間又出現在原位會突兀，讓它淡回來
                if (!motionReduced()) {
                    dragItem.animate([{ opacity: 0 }, { opacity: 1 }],
                        { duration: 240, easing: EASE_OUT });
                }
                triggerInstallFromDragItem();
            });
        }

        window.updateInstallProgress = function (percent, message) {
            document.getElementById('installProgressWrap').style.display = 'block';
            document.getElementById('installProgressText').innerText = message;
            document.getElementById('installProgressFill').style.width = percent + '%';
        };

        // ---------------- 主程式執行中：互動式關閉／取消 ----------------
        // trigger_installation() 偵測到主程式正在執行時，不直接判定安裝
        // 失敗，改回傳 process_running 狀態，讓這裡跳出「關閉程式並繼續
        // 安裝／取消」的彈窗。「關閉並繼續」按下去之後要重新呼叫一次
        // attemptInstall()，所以把安裝觸發邏輯抽成這個可以重複呼叫的函式，
        // 不論是拖曳觸發還是這裡重試都走同一條路徑。
        let lastCreateDesktopShortcut = true;

        function resetInstallUiAfterCancelOrFailure() {
            document.getElementById('installProgressWrap').style.display = 'none';
        }

        function cancelProcessRunningModal() {
            document.getElementById('processRunningModal').classList.remove('active');
            resetInstallUiAfterCancelOrFailure();
            pathPreview.innerText = /* 恢復成安裝前顯示的路徑 */ pathPreview.dataset.beforeInstall || '';
        }

        async function closeRunningAppAndRetry() {
            document.getElementById('processRunningModal').classList.remove('active');
            await pywebview.api.close_running_main_exe();
            attemptInstall(lastCreateDesktopShortcut);
        }

        // 保底選項：極少數情況下偵測會卡死（例如目標程式在系統層級留下
        // Windows 工作管理員都看不到、但行程表裡還存在的殭屍行程，
        // taskkill 對這種情況也沒用，只有重開機才會恢復正常）——這種情境
        // 讓使用者一直被卡在「關閉程式並繼續」也沒用的迴圈裡沒有意義，
        // 提供一個明確跳過偵測、強制繼續的出口。
        function forceContinueInstall() {
            document.getElementById('processRunningModal').classList.remove('active');
            attemptInstall(lastCreateDesktopShortcut, true);
        }

        // ---------------- 檔案使用中：互動式關閉鎖定程式並重試 ----------------
        // 複製檔案途中遇到 sharing/lock violation，trigger_installation()
        // 能查到是哪個程式鎖住的話會回傳 file_locked 狀態（含 processes
        // 清單），讓這裡跳出「關閉此程式／取消」的彈窗，不用逼使用者自己
        // 去工作管理員手動關閉。跟 process_running 是同一種互動模式。
        let lastLockingProcesses = [];
        let lastLockedPath = '';

        function cancelFileLockedModal() {
            document.getElementById('fileLockedModal').classList.remove('active');
            resetInstallUiAfterCancelOrFailure();
            pathPreview.innerText = pathPreview.dataset.beforeInstall || '';
        }

        async function closeLockingProcessAndRetry() {
            document.getElementById('fileLockedModal').classList.remove('active');
            await pywebview.api.close_locking_processes(lastLockingProcesses, lastLockedPath);
            attemptInstall(lastCreateDesktopShortcut);
        }

        async function attemptInstall(createDesktopShortcut, skipProcessCheck) {
            lastCreateDesktopShortcut = createDesktopShortcut;
            pathPreview.dataset.beforeInstall = pathPreview.innerText;
            document.getElementById('installProgressWrap').style.display = 'block';
            document.getElementById('installProgressText').innerText = t('initializing_install');
            document.getElementById('installProgressFill').style.width = '0%';
            pathPreview.innerText = t('installing');

            const result = await pywebview.api.trigger_installation(createDesktopShortcut, !!skipProcessCheck);

            if (result.status === 'success') {
                installSucceeded = true;
                showModal(t('install_success_title'), '', false, true);
                renderInstallWarnings(result.warnings);
                pathPreview.innerText = t('install_complete_path');
                document.getElementById('installProgressWrap').style.display = 'none';
            } else if (result.status === 'process_running') {
                resetInstallUiAfterCancelOrFailure();
                pathPreview.innerText = pathPreview.dataset.beforeInstall || '';
                document.getElementById('processRunningMessage').innerText = result.message;
                document.getElementById('processRunningModal').classList.add('active');
            } else if (result.status === 'file_locked') {
                resetInstallUiAfterCancelOrFailure();
                pathPreview.innerText = pathPreview.dataset.beforeInstall || '';
                lastLockingProcesses = result.processes || [];
                lastLockedPath = result.path || '';
                document.getElementById('fileLockedMessage').innerText = result.message;
                document.getElementById('fileLockedModal').classList.add('active');
            } else {
                installSucceeded = false;
                showModal(t('install_failed_title'), result.message, true, false);
                pathPreview.innerText = await pywebview.api.get_default_path();
                document.getElementById('installProgressWrap').style.display = 'none';
            }
        }

        // 拖曳命中資料夾之後（absorbIntoDropTarget 的收尾），以及用鍵盤選到
        // 圖示後按 Enter/空白鍵，都走這同一個函式——鍵盤不是另一條捷徑，是
        // 同一個拖曳目標的另一種操作方式，兩邊行為不會分岔。
        async function triggerInstallFromDragItem() {
            const createDesktopShortcut = document.getElementById('desktopShortcutCheck').checked;
            await attemptInstall(createDesktopShortcut);
        }
    </script>
</body>
</html>
